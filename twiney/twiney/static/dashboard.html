<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="20261002-0023">
<title>TED · Twiney Execution Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --panel:#131416; --panel2:#1a1b1e; --line:#26282c; --text:#d6d6d3; --dim:#7d7f85;
  --buy:#3fb56f; --sell:#d9534f; --gold:#e3a83a; --cyan:#5aa9d6; --violet:#a48bd6; --warn:#f0b429;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.on{border-color:var(--gold);color:var(--gold)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:#101113;position:sticky;top:0;z-index:5}
h1{font-size:16px;letter-spacing:.14em;margin:0 6px 0 0}
.pill{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;white-space:nowrap}
.pill.ok{border-color:var(--buy);color:var(--buy)} .pill.bad{border-color:var(--sell);color:var(--sell)}
.pill.warn{border-color:var(--warn);color:var(--warn)} .pill.ro{border-color:var(--violet);color:var(--violet)}
.dim{color:var(--dim)} .mono{font-family:var(--mono)} .spacer{flex:1}
main{padding:10px 16px;display:grid;gap:10px}
/* free layout: every block is a window on the desk */
body.free main{display:block;position:relative;min-height:1400px;padding:0}
body.free .pane.win{height:auto}
body.free .win{position:absolute;margin:0;resize:both;overflow:hidden;min-width:260px;min-height:120px;display:flex;flex-direction:column;z-index:1}
body.free .win.front{z-index:3}
.win.hidden{display:none !important}
/* resize from any edge or corner, not just the bottom-right grip */
.winbar .lnk{margin-left:6px;font:inherit;font-size:11px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:0 4px;cursor:pointer}
.addrow{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0} .addrow button{font-size:11px;padding:2px 6px}
.pop .rm{margin-left:auto;color:var(--dim);cursor:pointer} .pop .rm:hover{color:var(--sell)}
.book-tools{display:flex;justify-content:flex-end;padding:2px 6px 0} .book-tools .gear .pop{position:fixed;right:auto;top:auto}
.p-head button.off{color:var(--dim)}
.winbar .vtog{cursor:pointer;opacity:.35;padding:0 4px} .winbar .vtog.on{opacity:1;color:var(--gold);text-shadow:0 0 6px var(--gold)}
.pane.focus{outline:1px solid rgba(227,168,58,.55)}
.rs{position:absolute;z-index:4;user-select:none}
.rs.e{right:0;top:12px;bottom:12px;width:7px;cursor:ew-resize} .rs.w{left:0;top:12px;bottom:12px;width:7px;cursor:ew-resize}
.rs.n{top:0;left:12px;right:12px;height:6px;cursor:ns-resize} .rs.s{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rs.ne{top:0;right:0;width:14px;height:14px;cursor:nesw-resize} .rs.sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
.rs.nw{top:0;left:0;width:14px;height:14px;cursor:nwse-resize} .rs.se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rs:hover{background:rgba(227,168,58,.25)}
.pane.max .rs, .win.folded .rs{display:none}
.winbar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#121315;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;color:var(--dim);user-select:none;cursor:grab}
.winbar:active{cursor:grabbing}
.winbar b{color:var(--text)}
.winbar .x{margin-left:auto;cursor:pointer;padding:0 6px;font-size:13px}
.winbar .x:hover{color:var(--sell)}
.win .wbody{flex:1;min-height:0;overflow:auto}
#feed.win .wbody{padding:6px}
.winbar .fold{cursor:pointer;padding:0 4px}
.win.folded .wbody,.pane.folded > :not(.winbar):not(.p-head){display:none !important}
.pane.folded{height:auto !important;min-height:0}
body:not(.free) .winbar{cursor:default}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:220px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.open .pop{display:block}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12.5px;color:var(--text);cursor:pointer}
.pop h5{margin:6px 0 2px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#alertsBtn.off{color:var(--dim);text-decoration:line-through}
#recBtn.on{background:#3d1c1c;border-color:var(--sell);color:#f5dede;font-weight:700;animation:recblink 1.2s infinite}
@keyframes recblink{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 8px 1px var(--sell)}}
#desk{max-height:260px;overflow-y:auto}
#journal{max-height:220px;overflow-y:auto} #journalBody{padding:6px} .jform{display:flex;gap:6px;margin-bottom:6px}
.jform input{flex:1;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.jn{padding:3px 6px;border-radius:4px;background:var(--panel2);margin-bottom:3px;font-size:12.5px} .jn b{color:var(--gold);margin-right:6px} #deskBody{padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#deskBody h5{margin:2px 0 4px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.mk{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:4px;background:var(--panel2);margin-bottom:3px;font-size:12px;cursor:pointer}
.mk:hover{outline:1px solid var(--gold)} .mk b{color:var(--gold)} .mk .note{flex:1;color:#b8b8b4} .mk .hl{color:var(--dim);font-size:11px}
.rec{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:4px;background:var(--panel2);margin-bottom:3px;font-size:12px}
.rec.cur{outline:1px solid var(--sell)} .rec .nm{flex:1;font-family:var(--mono)} .rec button{padding:1px 6px;font-size:11px}
.rec button.del{color:var(--dim)} .rec button.del:hover{color:var(--sell);border-color:var(--sell)}
.rec a.btn{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--text);text-decoration:none;background:var(--panel)} .rec a.btn:hover{border-color:var(--gold)}
@media (max-width:900px){#deskBody{grid-template-columns:1fr}}
.p-head .gear{position:static}
.p-head .gear .pop{position:fixed;right:auto;top:auto}

.pane[data-hide~="trade"] .tradebar{display:none !important}
.pane[data-hide~="chart"] .chart-wrap,.pane[data-hide~="chart"] .divider{display:none !important}
.pane[data-hide~="chart"] .p-body{grid-template-columns:1fr}
.pane[data-hide~="ladder"] .ladder-wrap,.pane[data-hide~="ladder"] .divider{display:none !important}
.pane[data-hide~="ladder"] .p-body{grid-template-columns:1fr}
.pane[data-hide~="tape"] .p-tape{display:none !important}
.pane[data-hide~="banner"] .p-changed{display:none !important}
.pane[data-cols~="nomem"] .lad td.bars,.pane[data-cols~="nomem"] .lad th.bars{display:none}
.lad td.whoc{width:78px;padding:0 2px;overflow:hidden} .lad td.whoc.l{text-align:right} .lad td.whoc.r{text-align:left}
.lad th.who{width:78px}
.pane[data-cols~="notrade"] .lad td.act,.pane[data-cols~="notrade"] .lad th.act{display:none}
.pane[data-cols~="nolegend"] .legend{display:none}

/* plain-English feed */
#feed{max-height:150px;overflow-y:auto;padding:0}
#story{max-height:240px;overflow-y:auto}
#feedBody{display:grid;gap:4px}
body:not(.free) #feed.card{padding:0}
.say{padding:6px 10px;border-radius:6px;background:var(--panel);border-left:4px solid var(--dim);font-size:14px}
.say b{letter-spacing:.02em}
.say.buyer{border-color:var(--buy)} .say.seller{border-color:var(--sell)}
.say.cleaned{border-color:var(--gold)} .say.pulled{border-color:var(--violet)}
.say.fresh{background:#1f2024}
.say .age{float:right;color:var(--dim);font-size:11px;margin-left:10px}
.say .grade{float:right;margin-left:8px} .say .grade button{padding:0 5px;font-size:12px;opacity:.5;border:1px solid transparent}
.say .grade button.on{opacity:1;border-color:var(--gold);background:#2a2a1a} .say .grade button:hover{opacity:1}
tr.retired td{opacity:.55} tr.retired td.status{opacity:1;color:var(--gold)}

/* panes */
#panes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;position:relative}
.pane-trade{flex:1 1 100%;min-width:340px;height:auto;min-height:0}
.pane-chart{flex:2 1 520px;min-width:300px;height:440px;min-height:200px;resize:both}
.pane-book{flex:1 1 380px;min-width:280px;height:440px;min-height:200px;resize:both}
.pane-tape{flex:1 1 300px;min-width:220px;height:440px;min-height:120px;resize:both}
.pane-foot{flex:2 1 520px;min-width:300px;height:440px;min-height:200px;resize:both}
.pane-foot .chart-wrap{flex:1 1 0;margin:4px;min-height:0}
.pane.sized{flex:0 0 auto}
.pane.pinned{border-color:var(--gold)}
.pane-chart .chart-wrap{flex:1 1 0;margin:4px;min-height:0}
.pane-book .ladder-wrap{flex:1 1 0;margin:4px;min-height:0;height:auto}
.pane-tape .p-tape{flex:1 1 0;max-height:none;margin:4px;border-top:0;min-height:0}
.p-head{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;padding:8px 10px 4px;height:44px;flex:0 0 auto}
.p-head .sym{font-size:20px;font-weight:700;letter-spacing:.03em}
.p-quote{font-family:var(--mono);font-size:12px}
.p-changed{margin:0 10px;padding:4px 8px;border-radius:5px;background:#3a2f0a;color:var(--gold);font-size:12px;height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:0 0 auto}
.p-say{margin:4px 10px;padding:6px 10px;border-radius:6px;background:var(--panel2);border-left:5px solid var(--dim);font-size:15px;font-weight:600;height:52px;overflow:hidden;flex:0 0 auto;line-height:1.3}
.p-say.reload{border-color:var(--warn);background:#2a2412} .p-say.cleaned{border-color:var(--gold);background:#2b2610}
.p-say.pulled{border-color:var(--violet);background:#221a33} .p-say.watch{border-color:var(--cyan)}
.p-say.at{border-color:var(--gold)} .p-say.near{border-color:var(--cyan)}
.p-lines{margin:0 10px 4px 26px;padding:0;font-size:12.5px;color:#b8b8b4;height:78px;overflow-y:auto;flex:0 0 auto}
.p-lines li{margin:1px 0}
.p-ps60{margin:2px 10px 4px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;height:60px;overflow-y:auto;flex:0 0 auto;align-content:flex-start}
.p-ps60 .g{font-weight:700;padding:1px 8px;border-radius:10px;font-size:11px;letter-spacing:.04em}
.p-ps60 .g.READY{background:#173b28;color:var(--buy)} .p-ps60 .g.WATCH{background:#3a3016;color:var(--gold)} .p-ps60 .g.PASS{background:#3d1c1c;color:var(--sell)}
.p-ps60 .gates{display:inline-flex;gap:4px} .p-ps60 .gates span{cursor:help;font-size:11px}
.p-ps60 .se{flex-basis:100%;color:#b8b8b4} .p-ps60 button.use{padding:0 6px;font-size:11px}
.pane[data-hide~="keep"] .p-keep{display:none !important}
.p-keep{margin:2px 10px;height:22px;line-height:22px;font-size:12.5px;color:#b8b8b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.p-keep:empty{display:none}
#story{padding:0} #storyBody{display:grid;gap:6px;padding:6px}
.st{background:var(--panel2);border-radius:6px;padding:6px 10px;border-left:5px solid var(--dim)}
.st.reload{border-color:var(--warn)} .st.cleaned{border-color:var(--gold)} .st.pulled{border-color:var(--violet)} .st.watch,.st.near{border-color:var(--cyan)} .st.at{border-color:var(--gold)}
.st .sym{font-weight:700;font-size:14px;margin-right:8px} .st .hl{font-size:14px;font-weight:600}
.st ul{margin:3px 0 0 18px;padding:0;font-size:12.5px;color:#b8b8b4} .st li{margin:1px 0}
.st .p-ps60{margin:4px 0 0;height:auto;overflow:visible}
.pane.clean .chart-hint{display:none}
.cmenu{display:block;position:fixed;z-index:60;min-width:200px}
.cmenu button{display:block;width:100%;margin:3px 0;text-align:left;padding:5px 8px}
.cmenu .blvl{border-color:#5a4a1a;color:#ffe9a8} .cmenu .blvl.se{font-weight:700;border-color:#e6c15a}
.cmenu .bbuy{background:#173b28;border-color:var(--buy);color:#dff5e8;font-weight:700} .cmenu .bsell{background:#3d1c1c;border-color:var(--sell);color:#f5dede;font-weight:700}
.say.remount{border-color:var(--buy)} .say.rejection{border-color:var(--sell)}
td.grade{font-weight:700} td.grade.READY{color:var(--buy)} td.grade.WATCH{color:var(--gold)} td.grade.PASS{color:var(--sell)}
.p-body{flex:1 1 0;display:grid;grid-template-columns:minmax(0,1fr) 8px var(--ladder-w,340px);grid-template-rows:minmax(0,1fr);gap:4px;padding:4px 10px;min-height:300px}
.chart-wrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-tools{position:absolute;top:4px;left:6px;display:flex;gap:4px;z-index:2}
.chart-tools button{padding:1px 6px;font-size:11px;background:rgba(17,22,31,.85)}
.chart-wrap canvas{cursor:crosshair}
.chart-wrap canvas.pan{cursor:grabbing}
.chart-hint{position:absolute;right:6px;bottom:22px;font-size:10px;color:var(--dim);pointer-events:none;background:rgba(17,22,31,.7);padding:1px 4px;border-radius:3px}
.divider{width:8px;cursor:col-resize;border-radius:4px;background:transparent}
.divider:hover,.divider.on{background:var(--line)}
.p-head .grab{cursor:grab;color:var(--dim);font-size:16px;padding:0 4px;user-select:none}
.p-head .grab:active{cursor:grabbing}
.pane.dragging{opacity:.4}
.pane.dropzone{outline:2px dashed var(--gold)}
.pane.max{position:fixed;inset:8px;z-index:10;height:auto !important;width:auto !important;resize:none}
body.has-max #panes .pane:not(.max){visibility:hidden}
@media (max-width:900px){.pane-chart,.pane-book,.pane-tape{flex:1 1 100%;height:320px}}
.ladder-wrap{overflow-y:auto;border:1px solid var(--line);border-radius:6px;min-height:0;height:100%}
.p-tape{overflow-y:auto}
.empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--dim);text-align:center;padding:20px}

/* level-memory ladder */
.lad{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.lad th{position:sticky;top:0;background:#121315;color:var(--dim);font-weight:600;font-size:9px;letter-spacing:.03em;padding:3px 1px;z-index:3;text-align:center}
.lad td{padding:0 3px;height:19px;white-space:nowrap}
.lad .px{text-align:center;font-weight:600;color:#cfd8e6;border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;min-width:64px}
.lad .px .tag{margin-left:3px}
.lad .sz{text-align:right;width:46px}
.lad .ask .sz,.lad td.asz{text-align:left}
.lad td.bars{width:22%;position:relative;overflow:hidden}
.bar{position:absolute;top:3px;bottom:3px;border-radius:2px}
.bar.sold{right:2px;background:rgba(38,208,124,.55)}
.bar.bought{left:2px;background:rgba(255,77,94,.55)}
.bar-n{position:relative;font-size:10px;color:#e8eef7;z-index:1}
td.bars.l .bar-n{float:right;margin-right:3px} td.bars.r .bar-n{margin-left:3px}
.pips{font-size:9px;letter-spacing:-1px}
.pips.b{color:var(--buy)} .pips.a{color:var(--sell)}
.lad tr.gap td{border-top:2px dashed var(--line)}
.lad tr.best-bid td.bsz{color:var(--buy);font-weight:700}
.lad tr.best-ask td.asz{color:var(--sell);font-weight:700}
.lad tr.lvl td.px{color:#d6d6d3;font-weight:700}
.lad tr.lvl td{border-top:1px solid rgba(219,227,238,.3);border-bottom:1px solid rgba(219,227,238,.3)}
.lad tr.lastpx td.px{background:var(--gold);color:#0c0c0d;font-weight:800;border-radius:3px}
.lad tr.lastpx td.px::before{content:">";position:absolute;left:2px;color:#0c0c0d}
.lad tr.lastpx td{background:rgba(227,168,58,.10)}
.mine{display:inline-block;font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;border:1px solid #fff;color:#fff;margin-left:3px}
.chip.drag{opacity:.5} .lad tr.droptarget td{outline:1px dashed var(--gold)}
.chart-wrap canvas.lvltool{cursor:cell}
.chart-tools button.on.lvl,.chart-tools select.on{border-color:var(--gold);color:var(--gold)}
.chart-tools select{font:inherit;font-size:11px;background:rgba(17,22,31,.85);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
#pnl{font-family:var(--mono);font-weight:700} #pnl.up{color:var(--buy)} #pnl.dn{color:var(--sell)}
#locked{background:#5a1218;border-color:var(--sell);color:#fff;font-weight:800}
#replaybar{display:none;gap:8px;align-items:center;padding:6px 16px;background:#1a1530;border-bottom:1px solid var(--violet)}
#replaybar.on{display:flex}
#replaybar input[type=range]{width:160px}
.tradebar .risk{width:70px}
.keys{font-size:10.5px;color:var(--dim)}
.trap{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em}
.trap.l{background:#3a1216;color:#e8a3a3;border:1px solid var(--sell)} .trap.s{background:#173b28;color:#9fe0bd;border:1px solid var(--buy)}
.trap.heavy{animation:trapglow 1.4s infinite}
@keyframes trapglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 10px 1px currentColor}}
.io{font-size:9px;font-weight:800;padding:0 3px;border-radius:2px;margin-left:4px}
.io.in{background:var(--buy);color:#04210f} .io.out{background:var(--sell);color:#2a0409}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;background:var(--gold);color:#1a1300;margin-left:3px}
.who{display:inline-block;font-size:9.5px;font-weight:800;padding:0 4px;border-radius:3px;margin:0 2px}
.who.buyer{background:var(--buy);color:#04210f} .who.seller{background:var(--sell);color:#2a0409}
.who.big{font-size:10px;padding:0 3px;box-shadow:0 0 6px currentColor}
/* a proven row's brightness IS its conviction (--cv 0..1): ACTIVE bright and breathing, FADING steady, STALE dim */
.lad tr.rl-ask td{background:rgba(255,77,94,calc(.10 + .22 * var(--cv,1)))} .lad tr.rl-bid td{background:rgba(38,208,124,calc(.10 + .22 * var(--cv,1)))}
.lad tr.rl-ask td.px{color:var(--sell);font-weight:800} .lad tr.rl-bid td.px{color:var(--buy);font-weight:800}
.lad tr.cv-stale td.px{opacity:.55} .lad tr.cv-fading td.px{opacity:.8}
.who.fading{opacity:.78;box-shadow:none} .who.stale{opacity:.45;box-shadow:none}
.who.gone,.who.was{background:none;border:1px dashed var(--dim);color:var(--dim);box-shadow:none;font-weight:600}
/* REAL / MIXED / FAKE: of the size that has left this price, how much traded vs vanished (a thin line under the size) */
.lad td.sz.rf-REAL .szn{box-shadow:inset 0 -2px 0 rgba(38,208,124,.85)} .lad td.sz.rf-MIXED .szn{box-shadow:inset 0 -2px 0 rgba(227,168,58,.85)} .lad td.sz.rf-FAKE .szn{box-shadow:inset 0 -2px 0 rgba(255,77,94,.9)}
.lad td.sz.rf-FAKE .szn{text-decoration:line-through;text-decoration-color:rgba(255,77,94,.7);text-decoration-thickness:1px}
.cvbar{display:inline-block;width:46px;height:6px;border:1px solid var(--line);border-radius:3px;vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.cvbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)} .rl.buyer .cvbar i{background:var(--buy)} .rl.seller .cvbar i{background:var(--sell)}

/* ===== PS60 EXECUTION DESK — application shell ===== */
html,body{height:100%} body{overflow:hidden;font-size:12px}
#app{display:grid;grid-template-rows:34px 26px minmax(0,1fr) 22px;height:100vh}
#cmd{display:flex;align-items:center;gap:6px;padding:0 8px;background:#0e0f11;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}

#brand{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--gold);margin-right:4px}

#symIn::placeholder{color:#5b5d63;font:400 11px system-ui;letter-spacing:0;text-transform:none}
#symHist{font:inherit;font-size:11px;background:#0a0a0b;color:var(--dim);border:1px solid var(--line);border-radius:3px;max-width:40px}
#cmd .spacer{flex:1 1 0 !important;min-width:4px}

.led.ok{background:var(--buy);box-shadow:0 0 5px var(--buy)} .led.warn{background:var(--warn)} .led.bad{background:var(--sell)}
#armBtn{font-weight:800;letter-spacing:.06em} #armBtn.armed{background:#173b28;border-color:var(--buy);color:#dff5e8} #armBtn.off{color:var(--dim)}
#armBtn.locked{background:#5a1218;border-color:var(--sell);color:#fff}
#sideBtn{font-weight:800;padding:2px 7px;min-width:0;margin-left:2px} #sideBtn.long{background:#173b28;border-color:var(--buy);color:#dff5e8} #sideBtn.short{background:#5a1218;border-color:var(--sell);color:#fff} #sideBtn:disabled{opacity:.4}
/* workspace tab bar */
#wsbar{display:flex;align-items:center;gap:2px;padding:0 6px;background:#101113;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.stab{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;font:700 12px var(--mono);letter-spacing:.06em;color:var(--dim);border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;cursor:pointer;height:24px;box-sizing:border-box}
.stab.on{background:var(--panel);color:var(--gold);border-color:var(--line)}
.stab .x{font-size:10px;color:var(--dim);padding:0 2px} .stab .x:hover{color:var(--sell)}
.stab .v{font-size:10px;opacity:.7}
#wsbar .add{padding:1px 8px;font-size:12px;border-radius:3px}
#wsbar .right{margin-left:auto;display:flex;gap:4px;align-items:center}
#wsbar select,#wsbar button{font-size:11px;padding:1px 6px;border-radius:3px}
/* docking workspace */
#work{position:relative;display:grid;min-height:0;min-width:0;background:#09090a;
  grid-template-columns:var(--c1,0px) var(--g1,0px) minmax(0,1fr) var(--g2,0px) var(--c3,0px) var(--g3,0px) var(--c4,0px);
  grid-template-rows:minmax(0,1fr) var(--gr,0px) var(--r2,0px)}
.zone{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);margin:1px}
.zone.empty{display:none}
.zone[data-zone="TL"]{grid-column:1;grid-row:1} .zone[data-zone="TC"]{grid-column:3;grid-row:1} .zone[data-zone="TR"]{grid-column:5;grid-row:1} .zone[data-zone="TX"]{grid-column:7;grid-row:1}
.zone[data-zone="BL"]{grid-column:1;grid-row:3} .zone[data-zone="BC"]{grid-column:3;grid-row:3} .zone[data-zone="BR"]{grid-column:5;grid-row:3} .zone[data-zone="BX"]{grid-column:7;grid-row:3}
.zone.tall{grid-row:1/4}   /* a column with only one zone in it runs the full height */
.zone.drop{outline:2px solid var(--gold);outline-offset:-2px}
.ztabs{display:flex;align-items:stretch;height:22px;flex:0 0 auto;background:#121315;border-bottom:1px solid var(--line);overflow:hidden}
.ztab{display:inline-flex;align-items:center;gap:6px;padding:0 8px;font-size:10.5px;letter-spacing:.08em;color:var(--dim);cursor:grab;border-right:1px solid var(--line);user-select:none;white-space:nowrap}
.ztab.on{background:var(--panel);color:var(--text);font-weight:700}
.ztab .sym{color:var(--gold);font-family:var(--mono);letter-spacing:.02em;font-weight:700}
.ztab .ctl{display:none;gap:2px;margin-left:2px} .ztab.on .ctl{display:inline-flex}
.ztab .ctl span{cursor:pointer;padding:0 3px;color:var(--dim)} .ztab .ctl span:hover{color:var(--text)}
.zbody{flex:1 1 0;min-height:0;position:relative}
.pnl{position:absolute;inset:0;display:none;min-height:0;overflow:hidden;flex-direction:column}
.pnl.on{display:flex}
.pnl > .pc{flex:1 1 0;min-height:0;overflow:auto;position:relative}
.pnl > .pc.nos{overflow:hidden}
.gut{background:transparent;z-index:3} .gut:hover{background:rgba(227,168,58,.35)}
.gut.v{cursor:col-resize;grid-row:1/4} .gut.h{cursor:row-resize;grid-column:1/8;grid-row:2}
#g1{grid-column:2} #g2{grid-column:4}
/* floating panel */

.ticket .row{display:flex;gap:4px;align-items:center} .ticket .row input{flex:1}
.ticket .row button{padding:2px 6px;font-size:10.5px;border-radius:3px}
.ticket .sides{display:flex;gap:4px} .ticket .sides button{flex:1;font-weight:800;letter-spacing:.08em;padding:5px 0;border-radius:3px;opacity:.5}
.ticket .sides button.on{opacity:1} .ticket .sides .b.on{background:#173b28;border-color:var(--buy);color:#dff5e8} .ticket .sides .s.on{background:#3d1c1c;border-color:var(--sell);color:#f5dede}
.ticket .go{grid-column:1/3;display:flex;gap:6px;align-items:center;margin-top:2px}

.ticket .go button.tx.b{background:#173b28;border-color:var(--buy);color:#dff5e8} .ticket .go button.tx.s{background:#3d1c1c;border-color:var(--sell);color:#f5dede}

.ticket .why{grid-column:1/3;font-size:11px;color:var(--warn);min-height:14px}
.ticket .st{grid-column:1/3;font-family:var(--mono);font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:4px;max-height:80px;overflow:auto}
.ticket .st b{color:var(--text)}
.ticket .qbtn{padding:2px 6px}
.ticket .val{font-family:var(--mono)} .ticket .opts{grid-column:1/3;display:flex;gap:12px;color:var(--dim);font-size:11px}
/* tables */
.grid{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;background:#121315;color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.06em;padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
.grid td{padding:2px 6px;text-align:right;border-bottom:1px solid #1c1d20;white-space:nowrap}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid tr.sel td{background:#1f2024} .grid tr:hover td{background:#1a1b1e}

.stt{font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border-radius:2px;background:#1f2024}

.pct.up{color:var(--buy)} .pct.dn{color:var(--sell)}
/* quote strip inside the chart panel */

/* PS60 panel */
.ps60p{padding:6px 10px;font-size:12px} .ps60p .hl{font-size:13px;font-weight:600;margin-bottom:4px}

.menu .pop{min-width:200px}
.pop .row{display:flex;gap:6px;align-items:center;padding:2px 0} .pop input{font:inherit;font-size:11px;background:#0a0a0b;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:2px 5px}

.ladder-wrap{border:0;border-radius:0;height:100%}
.lad{font-size:11.5px} .lad td{height:18px}
#modal .box{border-radius:4px}
.legend{display:none}

/* PLAY SETUP: the trader's inputs; everything else derives from them */
.setup .hdr{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);letter-spacing:.06em}

.wlrow .gw{display:inline-flex;align-items:center;gap:3px;justify-self:end}
.pnl.fa{container-type:inline-size}
@container (max-width: 420px){ .fl .cols{gap:2px 9px;font-size:11.5px} .fl{padding:7px 10px 9px} .fa-sub{gap:8px} }

.fa-sub .fsw{background:#0f1522;border:1px solid #2a3344;border-radius:10px;color:#8b95a7;font:600 9.5px "IBM Plex Sans","Segoe UI",sans-serif;letter-spacing:.08em;padding:1px 8px;height:18px;text-transform:none}
.fa-sub .fsw b{color:#8b95a7;margin-left:3px} .fa-sub .fsw.on{border-color:#17a86a;color:#e6e9ef} .fa-sub .fsw.on b{color:#2ec27e}

/* SETTINGS */
#settings{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#settings[hidden]{display:none}
#settings .sbox{width:min(1100px,94vw);height:min(760px,90vh);background:#131416;border:1px solid #2c2e33;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#settings .shead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #26282c;background:#0f1012}
#settings .shead b{font:600 12px var(--sans);letter-spacing:.2em;color:#d6d6d3} #settings .shead .spacer{flex:1}
#settings #setFind{width:260px;height:26px;background:#0a0a0b;border:1px solid #2c2e33;color:var(--text);font:12px var(--sans);padding:0 10px}
#settings #setMsg{font:500 10.5px var(--sans);letter-spacing:.06em} #settings #setMsg.ok{color:var(--buy)} #settings #setMsg.no{color:var(--sell)}
#settings button.save{background:#2a2412;border-color:var(--gold);color:#f2d59a;font-weight:700;padding:4px 16px} #settings button.save:disabled{opacity:.35}
#settings #setRestart{background:#3d1c1c;border-color:var(--sell);color:#fff;font-weight:700}
#settings .sbody{flex:1;display:flex;min-height:0}
#settings .snav{width:210px;border-right:1px solid #26282c;overflow:auto;padding:6px 0;flex:none}
#settings .sn{padding:7px 14px;font:500 12px var(--sans);color:#a9aaaf;cursor:pointer;border-left:2px solid transparent}
#settings .sn:hover{background:#1a1b1e} #settings .sn.on{color:#e6e6e3;border-left-color:var(--gold);background:#1a1b1e} #settings .sn.none{opacity:.35}
#settings .sn i{font-style:normal;background:var(--gold);color:#0c0c0d;font:700 9px var(--sans);padding:0 5px;margin-left:4px}
#settings .sform{flex:1;overflow:auto;padding:6px 18px 30px}
#settings h4{font:600 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#e6e6e3;margin:14px 0 2px} #settings .sb{font:12px var(--sans);color:#7d7f85;margin-bottom:8px}
#settings .sf{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:9px 0;border-bottom:1px solid #1c1d20;align-items:center}
#settings .sf.dirty{box-shadow:inset 3px 0 0 var(--gold);padding-left:10px} #settings .sf.locked{opacity:.55}
#settings .sl b{font:600 12.5px var(--sans);color:#e6e6e3;margin-right:8px} #settings .sl i{font:700 8.5px var(--sans);letter-spacing:.12em;font-style:normal;padding:1px 5px;border:1px solid}
#settings .sl i.lv{color:#6fcf97;border-color:#2c6a45} #settings .sl i.rs{color:#e3a83a;border-color:#6b5420}
#settings .sh{font:11.5px/1.45 var(--sans);color:#8e9096;margin-top:3px} #settings code{font:10px var(--mono);color:#55575d}
#settings .si{display:flex;gap:6px;align-items:center}
#settings .si input,#settings .si select,#settings .si textarea{flex:1;width:100%;height:28px;background:#0a0a0b;border:1px solid #2c2e33;color:var(--text);font:12.5px var(--mono);padding:0 8px;box-sizing:border-box}
#settings .si textarea{height:auto;padding:4px 8px;resize:vertical}
#settings .sw{position:relative;width:40px;height:20px;flex:none} #settings .sw input{opacity:0;width:0;height:0;position:absolute}
#settings .sw span{position:absolute;inset:0;background:#2c2e33;border-radius:10px;cursor:pointer;transition:.15s} #settings .sw span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#8e9096;border-radius:50%;transition:.15s}
#settings .sw input:checked+span{background:#173b28} #settings .sw input:checked+span:before{transform:translateX(20px);background:var(--buy)}

/* the two feed lights, bottom-right corner */
#leds{display:inline-flex;gap:12px;align-items:center;margin-right:4px}
#leds .ld{display:inline-flex;align-items:center;gap:5px;font:600 9.5px var(--sans);letter-spacing:.14em;color:#8e9096;cursor:default}
#leds .ld i{width:8px;height:8px;border-radius:50%;background:#3a3c42;display:inline-block}
#leds .ld.green i{background:#34d17a;box-shadow:0 0 6px #34d17a} #leds .ld.green{color:#c9f2d8}
#leds .ld.amber i{background:#e3a83a;box-shadow:0 0 5px #e3a83a}
#leds .ld.red i{background:#e5484d;box-shadow:0 0 6px #e5484d;animation:ledp 1.4s infinite} #leds .ld.red{color:#f0a09c}
@keyframes ledp{50%{opacity:.35}}

/* workspace: four columns, each with its own top / bottom split */
#work{display:flex !important;flex-direction:row;align-items:stretch}
#work > .col{display:flex;flex-direction:column;min-width:0;min-height:0;flex:none}
#work > .col[data-col="C"]{flex:1 1 0;width:auto !important}
#work > .col.empty{display:none}
#work .zone{grid-column:auto !important;grid-row:auto !important;flex:none;min-height:0}
#work .zone.fill{flex:1 1 0}
#work .gut.v{width:5px;flex:none;cursor:col-resize;grid-column:auto;grid-row:auto}
#work .gut.h{height:5px;flex:none;cursor:row-resize;grid-column:auto;grid-row:auto}
body.dragging #work > .col{display:flex !important;min-width:150px}
body.dragging #work .zone{display:flex !important;min-height:70px}
body.dragging #work .zone:not(.fill){flex:0 0 auto}

/* the desk stopped answering: everything on screen is old, and looks it */
body.stale #work{filter:grayscale(.85);opacity:.6;transition:opacity .2s}

/* dividers: a wide, easy grab area with a thin line in the middle that lights up on hover and while held */
#work .gut{position:relative;background:transparent!important;z-index:6}
#work .gut.v{width:9px;margin:0 -2px}
#work .gut.h{height:9px;margin:-2px 0}
#work .gut::after{content:"";position:absolute;background:transparent;transition:background .12s,box-shadow .12s}
#work .gut.v::after{top:0;bottom:0;left:3px;width:3px}
#work .gut.h::after{left:0;right:0;top:3px;height:3px}
#work .gut:hover::after{background:rgba(227,168,58,.55)}
#work .gut.grab::after{background:#e3a83a;box-shadow:0 0 0 1px rgba(227,168,58,.35),0 0 10px rgba(227,168,58,.8)}
body.resizing{user-select:none}
body.resizing-v, body.resizing-v *{cursor:col-resize!important}
body.resizing-h, body.resizing-h *{cursor:row-resize!important}
body.resizing .zbody{pointer-events:none}

/* partial profit + breakeven */
.pp{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0;padding:6px 8px;border:1px solid rgba(227,168,58,.45);border-radius:4px;background:rgba(227,168,58,.07);font-size:11px}
.pp b{color:#e3a83a;letter-spacing:.04em;margin-right:4px}
.pp input{width:72px}
.pp .pp-sh{width:58px}
.pp button{padding:1px 7px;font-size:10.5px}
.pp .pp-send.s{background:var(--sell,#d9534f);color:#fff;border-color:transparent}
.pp .pp-send.b{background:var(--buy,#3fb56f);color:#0c0c0d;border-color:transparent}
.ticket .posbox{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px}
.ticket .posbox span{flex:1}
.ticket .pp{grid-column:1/-1}

/* take-off presets: one compact collapsible strip */
.ticket .takeoff{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:10.5px}
.takeoff .tohead{background:none;border:none;color:#e3a83a;font-weight:700;letter-spacing:.04em;padding:1px 2px;cursor:pointer}
.takeoff .topct,.takeoff .tobtns{display:flex;gap:3px;align-items:center}
.takeoff .topct button.on{background:rgba(227,168,58,.25);border-color:#e3a83a}
.takeoff button{padding:1px 6px;font-size:10.5px}
.takeoff .tobtns button{font-weight:700}

/* recording: mic, clips, replay controls, flags */
#micBtn.on{background:#b3123a;color:#fff;border-color:#ff2d55;animation:micpulse 1.2s infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 3px rgba(255,45,85,.35)}}
#micLive{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);max-width:640px;z-index:60;background:#12161f;border:1px solid #ff2d55;border-radius:6px;padding:8px 12px;font-size:12px;color:#d6d6d3;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#micLive b{display:block;color:#ff6b86;font-size:10.5px;letter-spacing:.05em;margin-bottom:3px}
.clipgrp{display:inline-flex;gap:0}
.clipgrp select{width:auto;padding:0 2px;font-size:10.5px}
#replaybar button{padding:1px 7px}
#rpScrub{width:220px;vertical-align:middle}
.rpclip{display:inline-flex;gap:3px;align-items:center;margin-left:8px}
.clip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px}
.clip b{color:#e3a83a}
.clip .note{flex:1;min-width:80px}
.clip button{padding:0 6px;font-size:10.5px}
.jn.voice{border-left:2px solid #ff2d55;padding-left:5px}
.jn.voice[data-jt]{cursor:pointer}
.rec .star{background:none;border:none;color:#7d7f85;font-size:14px;padding:0 4px;cursor:pointer}
.rec .star.on{color:#e3a83a}
.rec.flagged .nm{color:#e3a83a;font-weight:700}
.mk .play{padding:0 5px;font-size:10px}

/* ladder size cells: the number first and always whole; refills (↻n) and repeat (×n) are small tags after it */
.lad td.sz{white-space:nowrap;overflow:hidden}
.lad td.sz .szn{font-weight:700}
.lad td.sz .pips,.lad td.sz .bigx{font-size:9.5px;margin-left:3px;padding:0 2px;border-radius:2px;letter-spacing:0;vertical-align:1px}
.lad td.sz .pips.b{color:#3fb56f;background:rgba(38,208,124,.12)}
.lad td.sz .pips.a{color:#d9534f;background:rgba(255,77,94,.12)}
/* command bar: never runs off the screen. On a narrow or zoomed display (Windows scaling 125-150%) it wraps onto a
   second row instead of hiding SETTINGS / PANELS / VOICE past the edge; the desk below takes whatever height is left */
#app{grid-template-rows:auto 26px minmax(0,1fr) 22px}
#cmd{height:auto;min-height:34px;flex-wrap:wrap;row-gap:3px;padding:4px 10px;overflow:visible;position:relative;z-index:20}
#cmd .spacer{flex:1 1 0 !important;min-width:4px}
@media (max-width:1500px){ #brand .long{display:none} #cmd{gap:4px} #cmd button{padding:2px 6px} }
.cmenu .x{float:right;cursor:pointer;padding:0 4px;color:var(--dim)} .cmenu .x:hover{color:var(--text)}

</style>
</head>
<body>
<div id="app">
<div id="cmd">
  <span id="brand"><i></i><b>TED</b><span class="long"> TWINEY EXECUTION DESK</span></span>
  <span id="symbox"><input id="symIn" placeholder="SYMBOL" autocomplete="off" spellcheck="false"><select id="symHist" title="recent symbols"><option value="">RECENT</option></select></span>
  <span class="sep"></span>
  <button id="armBtn" class="off" title="Arm order entry. Disarmed at every launch.">ARM</button>

  <label title="Skip the confirmation box on every order"><input type="checkbox" id="oneclick"> one-click</label>
  <label title="Attach the play's stop and target to every entry"><input type="checkbox" id="bracket"> stop+target</label>
  <label title="PS60 exits: cash-flow scale-outs, runner to target, stop to breakeven after the first cash flow"><input type="checkbox" id="scale"> PS60 exits</label>
  <span class="sep"></span>
  <button id="recBtn" title="Record this session (space)">REC</button>
  <button id="markBtn" title="Marker (M)">MARK</button>
  <button id="shotBtn" title="Screenshot (P)">SNAP</button>

  <span class="clipgrp"><button id="clipBtn" title="Save the last minutes of this recording to the journal as a clip">CLIP</button><select id="clipLen" title="how far back the clip reaches"><option value="60">1m</option><option value="120" selected>2m</option><option value="300">5m</option><option value="600">10m</option></select></span>
  <span class="sep"></span>

</div>
<div id="wsbar">

  <button class="add" id="addTab" title="new symbol tab">+</button>
  <span class="right">
    <span class="dim" style="font-size:10.5px;letter-spacing:.06em">LAYOUT</span>
    <select id="layoutSel" title="saved layouts"></select>
    <span class="menu" id="layoutMenu"><button>MENU</button><div class="pop" id="layoutPop"></div></span>
  </span>
</div>
<div id="work">
  <div class="col" data-col="L"><div class="zone" data-zone="TL"><div class="ztabs"></div><div class="zbody"></div></div><div class="gut h" data-gut="h" data-col="L" title="drag to size this column's top and bottom windows"></div><div class="zone" data-zone="BL"><div class="ztabs"></div><div class="zbody"></div></div></div>
  <div class="gut v" id="g1" data-gut="c1"></div>
  <div class="col" data-col="C"><div class="zone" data-zone="TC"><div class="ztabs"></div><div class="zbody"></div></div><div class="gut h" data-gut="h" data-col="C" title="drag to size this column's top and bottom windows"></div><div class="zone" data-zone="BC"><div class="ztabs"></div><div class="zbody"></div></div></div>
  <div class="gut v" id="g2" data-gut="c3"></div>
  <div class="col" data-col="R"><div class="zone" data-zone="TR"><div class="ztabs"></div><div class="zbody"></div></div><div class="gut h" data-gut="h" data-col="R" title="drag to size this column's top and bottom windows"></div><div class="zone" data-zone="BR"><div class="ztabs"></div><div class="zbody"></div></div></div>
  <div class="gut v" id="g3" data-gut="c4"></div>
  <div class="col" data-col="X"><div class="zone" data-zone="TX"><div class="ztabs"></div><div class="zbody"></div></div><div class="gut h" data-gut="h" data-col="X" title="drag to size this column's top and bottom windows"></div><div class="zone" data-zone="BX"><div class="ztabs"></div><div class="zbody"></div></div></div>
</div>
<div id="status">

  <span id="stData">DATA <b>—</b></span>
  <span id="stOrders"><span class="led"></span>ORDERS <b>—</b></span>
  <span id="stLadders">LADDERS <b>—</b></span>
  <span id="stRec"></span>
  <span class="spacer"></span>
  <span id="stLoss" title="day loss lock: realized + open P&L against your daily limit">DAY LOSS LIMIT <b>—</b></span>
  <span id="leds"><span class="ld" id="ledMkt"><i></i>MKT</span><span class="ld" id="ledOpt"><i></i>OPT</span></span>

  <span id="stClock"></span>
</div>
</div>
<div id="replaybar">
  <b>REPLAY</b> <span id="rpFile" class="dim"></span>
  <button id="rpBack30" data-jump="-30" title="back 30 seconds (Shift+←)">⏪ 30s</button><button data-jump="-5" title="back 5 seconds">◀ 5s</button>
  <button id="rpPlay" title="play / pause (space)">PAUSE</button>

  <input type="range" id="rpScrub" min="0" max="1" step="1" value="0" title="drag to any moment of the recording">
  <span id="rpPos" class="mono"></span>

</div></div>

  <div class="pnl" data-p="chart"><div class="qs"></div><div class="cvstrip" id="cvStrip"></div><div class="pc nos"><div class="chart-wrap"><div class="chart-tools"></div><canvas></canvas></div></div></div>

  <div class="pnl" data-p="book"><div class="ladbar"><span>BIG ≥</span><input id="bigIn" type="number" min="100" step="500" title="shares that count as big on this symbol's ladder. Highlighted when showing; ×N = how many separate times it has shown up at that price today"><span class="dim">sh</span><button id="bigReset" title="back to the config default">DEFAULT</button><span class="dim" id="bigHint"></span><span class="spacer"></span><button id="ladMode" title="TIGHT: bid · price · ask with HIT / PAID beside them, reloaders as colour and a tag, one FLOW column. WIDE: every column (CALLS / PUTS money, who tags) spelled out">TIGHT</button><span class="menu" id="colsMenu"><button title="columns">COLS</button><div class="pop" id="colsPop"><h5>LEVEL II COLUMNS</h5><label><input type="checkbox" data-col="trade" checked> BUY / SELL buttons</label><label><input type="checkbox" data-col="bars" checked> flow bars (sold into bid / bought at ask)</label><label><input type="checkbox" data-col="who" checked> reload tags</label><label><input type="checkbox" data-col="flow" checked> option flow marks (where the stock was when big flow hit)</label><label style="margin-top:6px">Text size <select data-ladz><option value="1">normal</option><option value="1.2">bigger</option><option value="1.4">biggest (widen the LEVEL II pane)</option></select></label><div class="dim" style="font-size:10.5px;margin-top:6px">Drag the grip at the right edge of any header to resize. Double-click a grip to reset.</div></div></span></div><div class="rlban" id="rlBan"></div><div class="pc"><div class="ladder-wrap"></div></div></div>
  <div class="pnl" data-p="tape"><div class="pc"><div class="p-tape"></div></div></div>

  <div class="pnl" data-p="ps60"><div class="pc ps60p"></div></div>

  <div class="pnl" data-p="orders"><div class="pc"></div></div>
  <div class="pnl" data-p="watch"><div class="ladbar"><input id="wlAdd" placeholder="ADD TICKER" maxlength="10" spellcheck="false" autocomplete="off" style="width:96px;color:var(--text);letter-spacing:.06em"><button id="wlAddBtn" title="add this ticker to your watchlist: quotes, flow and alerts for it from now on">ADD</button><span class="dim" id="wlHint">type a ticker, Enter</span></div><div class="pc"></div></div>
  <div class="pnl" data-p="myalerts"><div class="ladbar"><span>NEW ALERT</span><span class="spacer"></span></div><div class="pc"><div id="alForm" class="alform">
      <input id="alSym" placeholder="TICKER" maxlength="10" spellcheck="false" autocomplete="off">
      <select id="alKind"><option value="price">PRICE hits</option><option value="above">PRICE goes above</option><option value="below">PRICE goes below</option><option value="flow">OPTION FLOW ≥ $</option><option value="flowC">CALL flow ≥ $</option><option value="flowP">PUT flow ≥ $</option><option value="equity">EQUITY print ≥ $</option></select>
      <input id="alVal" type="number" step="any" min="0" placeholder="price or $">
      <label title="off: fires once and is gone · on: keeps firing (with a cooldown)"><input type="checkbox" id="alRepeat"> every time</label>
      <button id="alAdd">ADD ALERT</button><span class="dim" id="alMsg"></span></div><div id="alList"></div></div></div>

// option flow leaning hard against the trade (last 30 min, bought at the ask): said out loud before it goes
function flowAgainst(pane, action){
  const f = pane && pane.flow; if (!f || f.bias == null) return "";
  const tot = (f.calls || 0) + (f.puts || 0); if (tot < 100000) return "";
  const k = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : "$" + Math.round(v / 1e3) + "K";
  if (action === "BUY" && f.bias <= -0.4) return ` ⚠ OPTION FLOW IS AGAINST THIS LONG: puts ${Math.round(f.puts / tot * 100)}% of ${k(tot)} (last ${f.minutes || 30}m).`;
  if (action === "SELL" && f.bias >= 0.4) return ` ⚠ OPTION FLOW IS AGAINST THIS SHORT: calls ${Math.round(f.calls / tot * 100)}% of ${k(tot)} (last ${f.minutes || 30}m).`;
  return "";
}
async function sendOrder(symbol, action, price, qty){
  const t = T();

  if (!canTrade()){ toast("Can't trade: " + whyNot(), false); return; }
  const go = async () => {
    const out = await post("/api/trade/order", {symbol, action, price, qty});
    toast(out.ok ? "Sent: " + out.sent : "Blocked: " + out.reason, out.ok);
  };
  if (t.one_click){ const w = flowAgainst((state.panes || []).concat(Object.values(state.extra || {})).find(d => d && d.symbol === symbol), action); if (w) toast(w.trim(), false); return go(); }
  const pane = (state.panes || []).concat(Object.values(state.extra || {})).find(d => d && d.symbol === symbol);
  const pl = pane ? pane.play : {};
  const legs = [];
  if (t.bracket){
    if (pl.stop && (action === "BUY" ? pl.stop < price : pl.stop > price)) legs.push("stop-limit " + px(pl.stop));
    if (t.scale){
      const sign = action === "BUY" ? 1 : -1;
      for (const l of t.scale_plan || []) legs.push(`${Math.round(l.fraction * 100)}% cash flow @ ${px(price + sign * l.dollars)}`);
      if (pl.target) legs.push("runner to " + px(pl.target));
    } else if (pl.target && (action === "BUY" ? pl.target > price : pl.target < price)) legs.push("target " + px(pl.target));
  }
  const g = pane && pane.ps60;
  const warn = (g && g.grade === "PASS" ? ` · PS60 PASS: ${g.why}.` : g && g.grade === "WATCH" ? ` · PS60 WATCH: ${g.why}.` : "") + flowAgainst(pane, action);
  confirmBox(`${action} ${sz(qty)} ${symbol} @ ${px(price)}`, `about $${sz(Math.round(qty * price))}` + (legs.length ? " · with " + legs.join(" + ") : " · no stop/target attached") + warn,
    action === "BUY" ? "b" : "s", go);
}

  const close = () => { m.remove(); document.removeEventListener("keydown", key); };

}

/* ---------- resizable columns: drag the right edge of any header cell ---------- */
function colKey(table){ return "cols." + (table.dataset.cols || "t"); }
function makeLadResizable(table){
  /* Level II columns in pixels: drag a grip and the boundary moves under the mouse (the column on its right gives
     or takes the width). Every column can go down to a few pixels, so the whole ladder shrinks as small as you
     want; the text clips instead of pushing the columns. Columns are scaled together to fill the pane. Double-click
     a grip: back to the default. Saved in this browser. */
  if (!table || table.dataset.gripped) return;
  table.dataset.gripped = "1";
  const ths = [...table.querySelectorAll("tr:first-child th")], n = ths.length, key = table.classList.contains("tight") ? "ladw5" : "ladw3";
  const DEF = ths.map(th => +th.dataset.w || 30), MINS = ths.map(th => +th.dataset.min || 12);
  let w = store.get(key, null); if (!Array.isArray(w) || w.length !== n || w.some(x => !(x > 0))) w = DEF.slice();
  table.style.tableLayout = "fixed";
  let cg = table.querySelector("colgroup");
  if (!cg){ cg = document.createElement("colgroup"); for (let i = 0; i < n; i++) cg.appendChild(document.createElement("col")); table.prepend(cg); }
  const vis = i => getComputedStyle(ths[i]).display !== "none";
  let sc = 1;
  const apply = () => {
    const z = parseFloat(getComputedStyle(table).getPropertyValue("--ladz")) || 1;
    const shown = [...Array(n).keys()].filter(vis), cols = [...cg.children];
    const sum = shown.reduce((a, i) => a + w[i] * z, 0) || 1;
    const avail = (table.parentElement && table.parentElement.clientWidth) || sum;
    sc = avail / sum;
    let tot = 0;
    shown.forEach((i, j) => { const px_ = Math.max(MINS[i], w[i] * z * sc); cols[j].style.width = px_.toFixed(1) + "px"; tot += px_; });
    for (let j = shown.length; j < n; j++) cols[j].style.width = "0px";
    table.style.width = tot.toFixed(1) + "px"; table.style.minWidth = "0";
  };
  apply();
  if (window.ResizeObserver && table.parentElement){ const ro = new ResizeObserver(() => { if (!table.isConnected){ ro.disconnect(); return; } apply(); }); ro.observe(table.parentElement); }
  ths.forEach((th, k) => {
    const g = document.createElement("span"); g.className = "colgrip"; g.title = "drag: resize · double-click: reset"; th.appendChild(g);
    g.addEventListener("mousedown", e => {
      e.preventDefault(); e.stopPropagation();
      let j = k + 1; while (j < n && !vis(j)) j++; if (j >= n) return;
      const x0 = e.clientX, z = parseFloat(getComputedStyle(table).getPropertyValue("--ladz")) || 1, s0 = sc, wk = w[k], wj = w[j], pair = wk + wj;
      const lo = i => MINS[i] / (z * s0);
      document.body.classList.add("colresizing");
      if (typeof bookDragging !== "undefined") bookDragging = true;     // the ladder holds still while you drag a column
      const move = ev => { let a = wk + (ev.clientX - x0) / (z * s0); a = Math.max(lo(k), Math.min(pair - lo(j), a)); w[k] = a; w[j] = pair - a; apply(); };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); document.body.classList.remove("colresizing"); store.set(key, w);
        if (typeof bookDragging !== "undefined") bookDragging = false; if (typeof P !== "undefined" && P.book) P.book.last = null; };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
    g.addEventListener("dblclick", e => { e.stopPropagation(); w = DEF.slice(); store.set(key, null); apply(); });
  });
  table._applyCols = apply;
}
function makeColsResizable(table){
  if (table && table.dataset.cols === "lad3") return makeLadResizable(table);
  /* fluid columns: weights that always add up to the table width. Dragging a grip trades width between the
     two columns beside it, so nothing ever overflows; double-click a grip to reset. Saved per table. */
  if (!table || table.dataset.gripped) return;
  table.dataset.gripped = "1";
  const ths = [...table.querySelectorAll("tr:first-child th")], n = ths.length, key = colKey(table);
  const DEF = ths.map(th => +th.dataset.w || 1), zoom = () => parseFloat(getComputedStyle(table).getPropertyValue("--ladz")) || 1;
  const MIN0 = ths.map(th => +th.dataset.min || 0); let MIN = MIN0.slice();
  let w = store.get(key, null); if (!Array.isArray(w) || w.length !== n || w.some(x => !(x > 0))) w = DEF.slice();
  table.style.tableLayout = "fixed";
  let cg = table.querySelector("colgroup");
  if (!cg){ cg = document.createElement("colgroup"); for (let i = 0; i < n; i++) cg.appendChild(document.createElement("col")); table.prepend(cg); }
  const vis = i => getComputedStyle(ths[i]).display !== "none";
  const OPT = ths.map(th => !!th.dataset.opt);
  const apply = () => {
    const z = zoom(); MIN = MIN0.map(m => Math.round(m * z));
    // bigger text needs more width: when the floors no longer fit, the blank BUY / SELL click columns go first
    // (right-click the chart or use the ticket to trade), so the sizes and prices stay whole and nothing scrolls sideways
    if (z > 1){
      const availZ = (table.parentElement && table.parentElement.clientWidth) || table.offsetWidth || 0;
      table.classList.remove("zoomtrim");
      const need = MIN.reduce((a, m, i) => a + (OPT[i] || getComputedStyle(ths[i]).display === "none" ? 0 : m), 0);
      if (need > availZ) table.classList.add("zoomtrim");
    } else table.classList.remove("zoomtrim");
    // an optional column (the ladder's FLOW) shows only when the pane has room for every floor plus its own
    if (OPT.some(x => x)){
      const avail0 = (table.parentElement && table.parentElement.clientWidth) || table.offsetWidth || 0;
      const base = MIN.reduce((a, m, i) => a + (OPT[i] || getComputedStyle(ths[i]).display === "none" ? 0 : m), 0);
      const extraNeed = MIN.reduce((a, m, i) => a + (OPT[i] ? m : 0), 0);
      const room = avail0 >= base + extraNeed && !table.classList.contains("noflow");
      table.classList.toggle("flowcol", room);
    }
    const tot = w.reduce((a, x, i) => a + (vis(i) ? x : 0), 0) || 1;
    const floor = MIN.reduce((a, m, i) => a + (vis(i) ? m : 0), 0);
    // a hidden column (display:none) takes no place in the table grid, so the <col>s line up with the VISIBLE columns in
    // order: the j-th col is the j-th visible column; the cols left over are parked at 0
    const shown = [...Array(n).keys()].filter(vis), cols = [...cg.children];
    const set = widths => { shown.forEach((i, j) => { cols[j].style.width = widths(i); }); for (let j = shown.length; j < n; j++) cols[j].style.width = "0px"; };
    if (!floor){ set(i => (100 * w[i] / tot).toFixed(3) + "%"); return; }
    // floors first, then the spare width by weight; narrower than the floors: the table keeps them and scrolls
    const avail = (table.parentElement && table.parentElement.clientWidth) || table.offsetWidth || floor;
    table.style.minWidth = floor + "px";
    const tw = Math.max(avail, floor), extra = tw - floor;
    set(i => ((MIN[i] + extra * w[i] / tot) / tw * 100).toFixed(3) + "%");
  };
  apply();
  if (MIN.some(m => m) && window.ResizeObserver && table.parentElement){ const ro = new ResizeObserver(() => { if (!table.isConnected){ ro.disconnect(); return; } apply(); }); ro.observe(table.parentElement); }
  ths.forEach((th, k) => {
    const g = document.createElement("span"); g.className = "colgrip"; g.title = "drag: resize · double-click: reset columns"; th.appendChild(g);
    g.addEventListener("mousedown", e => {
      e.preventDefault(); e.stopPropagation();
      let j = k + 1; while (j < n && !vis(j)) j++; if (j >= n) return;
      const x0 = e.clientX, tw = table.offsetWidth, tot = w.reduce((a, x, i) => a + (vis(i) ? x : 0), 0), wk = w[k], wj = w[j], pair = wk + wj, min = tot * 0.04;
      const move = ev => { let a = wk + (ev.clientX - x0) / tw * tot; a = Math.max(min, Math.min(pair - min, a)); w[k] = a; w[j] = pair - a; apply(); };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); store.set(key, w); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
    g.addEventListener("dblclick", e => { e.stopPropagation(); w = DEF.slice(); store.set(key, null); apply(); });
  });
  table._applyCols = apply;
}

    }

      const price = yAt(), per = (v.chartY[1] - v.chartY[0]) / ((v.chartH || 1) - 8);
      const nearOrder = (p.data.orders || []).some(o => o.price && Math.abs(o.price - price) <= per * 5);
      // the pivot is locked on the chart: once set it only changes from PLAY SETUP (or the mark tool, which asks)

          const pr = lv.price + dp, tk = pr >= 1 ? 0.01 : 0.0001; p.dragLevel.price = +(Math.round(pr / tk) * tk).toFixed(4); drawChart(p); };
        const up = async () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);

          else out = await post("/api/level", {symbol: p.data.symbol, price: d.price, role: d.role});

        v.follow = v.offset < 0.5; v.rightT = null;
        if (start.y && !onAxis){ const [lo, hi] = start.y; const per = (hi - lo) / start.h; v.yLo = lo + dy * per; v.yHi = hi + dy * per; }

    };

      const cx = ev.clientX - r.left, cy = ev.clientY - r.top, hit = b => b && cx >= b[0] && cx <= b[0] + b[2] && cy >= b[1] && cy <= b[1] + b[3];

  cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); v.cross = [e.clientX - r.left, e.clientY - r.top];

    else if (e.key === "ArrowUp"){ v.cw = Math.min(isFoot ? 120 : 60, v.cw * 1.2); }
    else if (e.key === "ArrowDown"){ v.cw = Math.max(isFoot ? 34 : 2, v.cw / 1.2); }
    else if (e.key === "Home"){ v.offset = restOffset(); v.follow = true; v.rightT = null; }
    else if (e.key === "End"){ v.offset = 1e9; v.follow = false; v.rightT = null; }
    else return false;
    saveView(); drawChart(p); return true;
  };
}

// ---------- chart trading: right-click (or hover + B / S) = limit order at that price
function chartPrice(p){
  const v = p && p.view && p.view.cross && p.view.chartY ? p.view : null;
  if (!v) return null;
  const [, cy] = v.cross;
  if (cy > (v.chartH || 0)) return null;
  const pr = v.chartY[1] - (cy - 8) / ((v.chartH || 1) - 8) * (v.chartY[1] - v.chartY[0]);
  const tk = pr >= 1 ? 0.01 : 0.0001;
  return +(Math.round(pr / tk) * tk).toFixed(4);
}

function pips(n, cls){
  if (!n) return "";
  // compact, so the size itself is never pushed out of the cell
  return `<span class="pips ${cls}" title="size came back ${n}x after being hit">↻${n}</span>`;
}

function realWords(rf){
  if (!rf) return "";
  return `of the ${sz(rf.filled + rf.pulled)} shares that left this price, ${Math.round(rf.pct * 100)}% traded and ${Math.round((1 - rf.pct) * 100)}% just vanished: ${rf.label === "REAL" ? "size here is REAL, it gets filled" : rf.label === "FAKE" ? "size here is FAKE, it gets pulled before it trades" : "MIXED, some of it trades, some of it gets pulled"} (inferred from size changes between book reads, read it as a tilt)`;
}
function szTitle(row, side){
  const n = row[side] || 0, rf = row[side + "_real"]; if (!n && !rf) return "";
  const bg = row[side + "_big"], f = row[side + "_refills"] || 0;
  const bits = n ? [Math.round(n).toLocaleString("en-US") + " shares"] : [];
  if (f) bits.push("refilled " + f + "x after getting hit");
  if (bg) bits.push((bg.huge ? "huge" : "big") + " size" + (bg.times > 1 ? ", shown up here " + bg.times + " times today" : ""));
  if (rf) bits.push(realWords(rf));
  return ` title="${esc(bits.join(" · "))}"`;
}
// Dan's words for where a reloader stands. The desk never says fading, stale or gone.
const STAGE_SLUG = {"RELOADING": "active", "STILL THERE": "fading", "NOT RELOADING": "stale", "CLEANED UP": "gone", "PULLED": "gone"};
const STAGE_ORDER = {"RELOADING": 0, "STILL THERE": 1, "NOT RELOADING": 2, "CLEANED UP": 3, "PULLED": 3};
function stageSlug(st){ return STAGE_SLUG[st] || ""; }
function stageWords(st, side){
  const who = side === "bid" ? "buyer" : "seller";
  return st === "RELOADING" ? `he's reloading: size came back after getting hit, little has traded through since` :
         st === "STILL THERE" ? `he's still there but hasn't reloaded in a bit` :
         st === "NOT RELOADING" ? `he's not reloading: more has traded through than he was putting back. Don't lean on him` :
         st === "CLEANED UP" ? `he got cleaned up: price came back and the level didn't hold` :
         st === "PULLED" ? `he pulled: the size left without getting hit` : "";
}
// option flow marks on a ladder row: the FLOW column when the ladder is wide enough, else a dot in the tag column
function flowK(v){ return v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "K"; }
function flowStrike(k){ return Number.isInteger(+k) ? String(k) : (+k).toFixed(2).replace(/\.?0+$/, ""); }
function flowTitle(f){ return f.items.map(m => `${m.cp === "C" ? "CALL" : "PUT"} ${px(m.strike)} ${m.exp}${m.dte != null ? " (" + m.dte + "d)" : ""} $${flowK(m.prem)} ${m.side === "ask" ? "at the ask" : "at the bid"}${m.kind !== "trade" ? " " + m.kind : ""}${m.hot ? " · REPEAT, short-dated" : ""}${m.urgent ? " · URGENT" : ""} · ${ago(m.age)} ago`).join("\n"); }
function flowCell(r){
  const f = r.flow; if (!f) return "";
  const lead = f.c >= f.p ? "c" : "p", top = f.items[0];
  return `<span class="fm ${lead} ${f.hot ? "hot" : ""}" title="${esc(flowTitle(f))}">${f.urgent ? `<em class="urg">⚡</em>` : ""}${f.c ? `<b class="c">C$${flowK(f.c)}</b>` : ""}${f.p ? `<b class="p">P$${flowK(f.p)}</b>` : ""}${top ? `<i>${flowStrike(top.strike)}${top.dte != null ? "·" + top.dte + "d" : ""}</i>` : ""}${f.n > 1 ? `<u>×${f.n}</u>` : ""}</span>`;
}
function flowDot(r){
  const f = r.flow; if (!f) return "";
  return `<span class="fdot ${f.c >= f.p ? "c" : "p"} ${f.hot ? "hot" : ""}" title="${esc(flowTitle(f))}">${f.urgent ? "⚡" : "●"}${f.n > 1 ? `<u>${f.n}</u>` : ""}</span>`;
}
// SOMEBODY KNOWS: short-dated out-of-the-money flow at the ask agreeing with the level (calls for a buyer, puts for a seller)
function knowsTag(kn){
  if (!kn) return "";
  if (kn.knows) return `<span class="knows" title="${esc(kn.words)}">⚡</span>`;

function whoTag(row, side){

    const since = row[side + "_since_refill"] || 0, age = row[side + "_refill_age"];

// seconds to add to a UTC timestamp to get New York wall time (session anchors: 9:30 open, day rollover)
// New York's offset only changes at the DST switch: one answer per hour, remembered (the time axis asks per bar, per frame)
const ET_FMT = new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"});
const ET_OFF = new Map();

  const v = etOffsetRaw(h * 3600);

function etOffsetRaw(t){

  const g = k => +parts.find(x => x.type === k).value;
  return Math.round(Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute"), g("second")) / 1000 - t);

/* timeframes: a number is minutes (60 = 1 hour); "D", "2D", "W", "M", "5M" build from the daily bars */
function tfLabel(tf){

  const m = /^(\d*)([DWM])$/.exec(String(tf)); if (!m) return String(tf);

  if (u === "MONTH" && n % 12 === 0) return n === 12 ? "YEARLY" : (n / 12) + " YEAR";
  return n === 1 ? (u === "DAY" ? "DAILY" : u === "WEEK" ? "WEEKLY" : "MONTHLY") : n + " " + u;
}

  const m = /^(\d*)([DWM])$/.exec(String(tf)); if (!m) return (daily || []).map(b => b.slice());
  const n = +m[1] || 1, u = m[2], out = [];

  for (const b of daily || []){
    const dt = new Date(b[0] * 1000);
    let k;
    if (u === "D") k = Math.floor(cnt / n);
    else if (u === "W"){ const wk = Math.floor((b[0] + 4 * 86400) / (7 * 86400)); k = Math.floor(wk / n); }   // weeks start Monday
    else k = Math.floor((dt.getUTCFullYear() * 12 + dt.getUTCMonth()) / n);
    cnt++;
    const last = out[out.length - 1];
    if (last && k === key){ last[2] = Math.max(last[2], b[2]); last[3] = Math.min(last[3], b[3]); last[4] = b[4]; last[5] += b[5] || 0; }
    else { out.push([b[0], b[1], b[2], b[3], b[4], b[5] || 0, 0, 0]); key = k; }
  }

}

    const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const kA = Math.max(0, Math.floor(-x0 / cw) - 1), kB = Math.min(bars.length - 1, Math.ceil((plotW - x0) / cw) + 1);
    const parts = t => { const d = new Date((t + etOffset(t)) * 1000); return {y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), dow: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes()}; };
    const monthly = /[WM]$/.test(String(tf)), cand = [];
    let prev = kA > 0 ? parts(bars[kA - 1][0]) : null;
    for (let k = kA; k <= kB; k++){
      const q = parts(bars[k][0]); let rank = 0, txt = "", kind = "t";
      if (!prev){ rank = 45; txt = isDaily ? `${MON[q.m]} ${String(q.y).slice(2)}` : `${MON[q.m]} ${q.d}`; kind = "day"; }   // the first bar of the history: no boundary behind it
      else if (q.y !== prev.y){ rank = 100; txt = String(q.y); kind = "y"; }
      else if (q.m !== prev.m){ rank = 90; txt = MON[q.m]; kind = "m"; }
      else if (isDaily){
        if (!monthly && q.dow < prev.dow){ rank = 50; txt = String(q.d); kind = "d"; }        // a new week
        else if (!monthly){ rank = 10; txt = String(q.d); kind = "d"; }
      } else if (q.d !== prev.d){ rank = 80; txt = `${MON[q.m]} ${q.d}`; kind = "day"; }
      else {
        const mm = q.min;
        rank = mm % 240 === 0 ? 60 : mm % 120 === 0 ? 55 : mm % 60 === 0 ? 50 : mm % 30 === 0 ? 40 : mm % 15 === 0 ? 30 : mm % 5 === 0 ? 20 : 10;
        txt = nyHM(bars[k][0]);
      }
      if (rank) cand.push({k, rank, txt, kind, x: x0 + k * cw + cw / 2});
      prev = q;
    }
    // the first visible bar only gets a date if nothing better is near (it isn't a real boundary)
    if (cand.length && cand[0].k === kA && kA > 0 && cand[0].rank >= 80) cand[0].rank = 45;
    g.font = "11px ui-monospace, Menlo, Consolas, monospace";
    const placed = [];
    cand.sort((a, b) => b.rank - a.rank || a.k - b.k);
    for (const c of cand){
      const w = g.measureText(c.txt).width, l = c.x - w / 2 - 7, r = c.x + w / 2 + 7;
      if (l < 2 || r > plotW - 2) continue;
      if (placed.some(p => l < p.r && r > p.l)) continue;
      placed.push({l, r, c});
    }
    g.save(); g.textAlign = "center";
    for (const {c} of placed){
      if (c.kind !== "t" && c.kind !== "d"){               // a session / month / year boundary: brighter, bold
        g.fillStyle = C.dots ? "#e6c15a" : "#e6c15a"; g.font = "bold 11px ui-monospace, Menlo, Consolas, monospace";
      } else { g.fillStyle = C.text; g.font = "11px ui-monospace, Menlo, Consolas, monospace"; }
      g.fillText(c.txt, c.x, H - 4);
      g.strokeStyle = C.axis; g.beginPath(); g.moveTo(c.x + .5, plotH + volH); g.lineTo(c.x + .5, plotH + volH + 4); g.stroke();   // tick
    }
    g.restore();
    g.font = "11px ui-monospace, Menlo, Consolas, monospace";
    v.timeAxisY = H - 16;
  }
  // key
  if (!clean){ g.fillStyle = "#7d7f85";
    g.fillText("GREEN BUYER ABSORBING · RED SELLER ABSORBING · R/C/P RELOAD / CLEANED / PULLED", 60, H - volH - 4); }
  if (off > 0){ g.fillStyle = "#e3a83a"; g.fillText(`${off} BARS BACK · DOUBLE-CLICK FOR LIVE`, plotW - 230, 14); }
  // the 2nd entry tag's reason, when the mouse is on it
  if (v.seChip && v.cross && v.cross[0] >= v.seChip.x && v.cross[0] <= v.seChip.x + v.seChip.w && Math.abs(v.cross[1] - (v.seChip.y + 7)) <= 9){
    const t = v.seChip.text, tw = g.measureText(t).width + 12, tx = Math.max(4, Math.min(plotW - tw - 4, v.seChip.x - tw)), ty = v.seChip.y - 20 < 2 ? v.seChip.y + 18 : v.seChip.y - 20;
    g.fillStyle = "rgba(17,22,31,.95)"; g.fillRect(tx, ty, tw, 16); g.fillStyle = "#d6d6d3"; g.fillText(t, tx + 6, ty + 12);
  }
  // crosshair with price / time readout
  p.dataPrice = (v.cross && v.cross[1] < plotH && v.cross[0] < plotW) ? hi - (v.cross[1] - 8) / (plotH - 8) * (hi - lo) : null;
  if (!isFoot && typeof renderDataWin === "function") renderDataWin(p);
  if (v.cross){
    const [cx, cy] = v.cross;
    if (cx < plotW && cy < plotH){
      const xs = CS("cross", "auto");
      g.strokeStyle = CS("crossCol", "") || (dan ? "#ff0000" : "#7d7f85"); g.setLineDash(xs === "solid" ? [] : xs === "dashed" ? [5, 4] : xs === "dotted" ? [1, 3] : (dan ? [] : [3, 3])); g.lineWidth = 1;
      if (xs !== "off"){ g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, plotH); g.moveTo(0, cy); g.lineTo(plotW, cy); g.stroke(); }
      g.setLineDash([]);
      const pr = hi - (cy - 8) / (plotH - 8) * (hi - lo);
      if (!isFoot && typeof ladderHighlight === "function") ladderHighlight(pr);
      g.fillStyle = dan ? "#ff0000" : "#26282c"; g.fillRect(plotW, cy - 8, labelW, 16);
      g.fillStyle = "#d6d6d3"; g.fillText(px(pr), plotW + 3, cy + 4);
      const k = Math.floor((cx - x0) / cw);
      if (bars[k]){                                    // the bar's date and time, boxed on the time axis
        const bt = bars[k][0], bx = x0 + k * cw + cw / 2;
        const tt = isDaily ? nyDate(bt, {weekday: "short", month: "short", day: "numeric", year: "2-digit"})
                           : nyDate(bt, {weekday: "short", month: "short", day: "numeric"}) + "  " + nyHM(bt);
        const tw = g.measureText(tt).width + 12, lx = Math.max(0, Math.min(plotW - tw, bx - tw / 2));
        g.fillStyle = dan ? "#ff0000" : "#26282c"; g.fillRect(lx, H - 17, tw, 17);
        g.fillStyle = "#d6d6d3"; g.fillText(tt, lx + 6, H - 4);
      }
      if (bars[k] && !(store.get("datawin", true) && !isFoot)){   // the data window carries this when it is on
        const b = bars[k], dt = isDaily ? nyDate(b[0], {month: "short", day: "numeric"}) : nyDate(b[0], {month: "short", day: "numeric"}) + " " + nyHM(b[0]);
        const txt = `${dt}  O ${px(b[1])} H ${px(b[2])} L ${px(b[3])} C ${px(b[4])}  vol ${kfmt(b[5])}`;
        g.fillStyle = "rgba(17,22,31,.9)"; g.fillRect(6, 4, g.measureText(txt).width + 10, 16);
        g.fillStyle = "#d6d6d3"; g.fillText(txt, 11, 16);
      }
    }
  }
}

const spoken = new Set(); let voiceFirst = true;
let voicePick = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    voicePick = vs.find(v => /en[-_]US/i.test(v.lang) && /natural|neural|online/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || vs[0] || null;
  } catch (e) { voicePick = null; }
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function say(text, force){
  if (!force && !store.get("voice", true)) return;
  if (!("speechSynthesis" in window)){ if (force) toast("This browser has no speech. Use Chrome or Edge.", false); return; }
  try {
    if (!voicePick) pickVoice();
    if (force) speechSynthesis.cancel();                 // a click: say it now, drop any backlog
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text.replace(/×/g, " times ").replace(/\$/g, "").replace(/\bk\b/g, " thousand"));
    if (voicePick) u.voice = voicePick;
    u.rate = 1.05; u.pitch = 1; u.volume = store.get("voiceVol", 1);
    u.onerror = ev => { if (force) toast("Voice error: " + (ev.error || "unknown") + ". Windows: Settings → Time & language → Speech → add a voice.", false); };
    speechSynthesis.speak(u);
    if (force && !speechSynthesis.getVoices().length) toast("No voices installed in this browser yet. Windows: Settings → Time & language → Speech → Manage voices.", false);
  } catch (e) { if (force) toast("Voice failed: " + e.message, false); }
}

function callWords(a){
  const who = a.side === "bid" ? "buyer" : "seller", at = `at ${px(a.price)}`;
  const kshares = n => n >= 1000 ? Math.round(n / 1000) + " thousand" : String(n);
  if (a.label.startsWith("RELOAD")) return `${a.symbol}: confirmed reload ${who} ${at}. Reloaded ${a.refreshes} times, ${kshares(a.absorbed)} shares absorbed.`;
  if (a.label === "CLEANED UP") return `${a.symbol}: ${who} ${at} cleared out. ${kshares(a.absorbed)} shares ate through it.`;
  if (a.label === "PULLED") return `${a.symbol}: ${who} ${at} pulled. Never got hit.`;
  if (a.label === "REMOUNT") return `${a.symbol}: remount ${at}.`;
  if (a.label === "REJECTION") return `${a.symbol}: rejection ${at}.`;
  return `${a.symbol}: ${a.label.toLowerCase()} ${at}`;
}
function speakNew(s){
  const items = [];

  for (const a of (s.alerts || []).slice(0, 5)) if (!spoken.has("a" + a.key) && s.now - a.t < 30){ spoken.add("a" + a.key); if (voiceAllowed(a.symbol)) items.push(callWords(a)); }
  if (voiceFirst){ voiceFirst = false; return; }   // don't read the backlog on page load
  if (!store.get("voice", true)) return;
  if (items.length > 3) items.splice(0, items.length - 3);   // never fall behind the market
  for (const t of items.reverse()) say(t);
}

/* ---------- docking */
function emptyLayout(){ return {zones: {TL: [], TC: [], TR: [], TX: [], BL: [], BC: [], BR: [], BX: []}, active: {}, sizes: {c1: 250, c3: 430, c4: 300, r2: {L: 300, C: 300, R: 300, X: 300}}, floats: {}, hidden: [], max: null}; }
function normalize(l){
  const out = Object.assign(emptyLayout(), JSON.parse(JSON.stringify(l || {})));
  for (const z of ZONES) out.zones[z] = (out.zones[z] || []).filter(id => P[id]);
  // bottom heights are per column now; an older layout had one height for the whole bottom row
  const r2 = out.sizes.r2;
  if (typeof r2 === "number" || !r2) out.sizes.r2 = {L: r2 || 300, C: r2 || 300, R: r2 || 300, X: r2 || 300};
  const placed = new Set([].concat(...ZONES.map(z => out.zones[z])).concat(Object.keys(out.floats || {})));
  // a panel new in a build docks itself once (ALERTS beside the watchlist, EQUITY FLOW beside the option flow), so it is
  // not lost behind the PANELS menu; a panel you hid yourself stays hidden
  const NEW_PANELS = {myalerts: "TL", eqflow: "BC", urgency: "BC", bigmoney: "BC", conviction: "BC"};
  out.seen = Array.isArray(out.seen) ? out.seen : Object.keys(P).filter(id => !(id in NEW_PANELS));
  for (const id of Object.keys(NEW_PANELS)) if (P[id] && !out.seen.includes(id)){ out.seen.push(id); if (!placed.has(id)){ out.zones[NEW_PANELS[id]].push(id); placed.add(id); } }
  out.hidden = Object.keys(P).filter(id => !placed.has(id));

}

// gutters: grab any divider and pull or push. While you hold it the divider lights up as a line and only that

function ppDefaults(sym){
  const d = ((state && state.panes) || []).concat(Object.values((state && state.extra) || {})).find(x => x && x.symbol === sym);
  const pos = d && d.position; if (!pos) return null;
  const long = pos.qty > 0, q = Math.abs(pos.qty), last = d.last || pos.avg_cost, tgt = d.play && d.play.target;

let timer = null, lastGood = Date.now();
// every second, whatever the requests are doing: no answer for 2 s = lights red, screen greyed (never green over frozen prices)
setInterval(() => {
  const lost = Date.now() - lastGood > 2000;
  document.body.classList.toggle("stale", lost);
  if (lost) for (const id of ["ledMkt", "ledOpt"]){ const el = document.getElementById(id); if (el){ el.className = "ld red"; el.title = "No answer from TED for " + Math.round((Date.now() - lastGood) / 1000) + " s — prices on screen are NOT live"; } }
}, 1000);
const BARS = {};   // symbol -> {bars, daily, ver}: the page's own copy of the history
const HVER = {};   // symbol -> the history version the engine last reported
async function poll(now){
  clearTimeout(timer);
  try {
    const extra = [...new Set(TABS.list.concat(curSym ? [curSym] : []))].join(",");
    // history is fetched once per symbol and kept here; every poll after that carries only the last bars
    // fetch it again whenever the engine's history for that symbol has changed (IBKR history lands after startup)
    const need = [...new Set(TABS.list.concat(curSym ? [curSym] : []).concat((state && state.symbols) || []))].filter(s => !BARS[s] || (HVER[s] != null && BARS[s].ver !== HVER[s]));
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 2500);   // a hung request never freezes the desk
    const r = await fetch("/api/state?extra=" + encodeURIComponent(extra) + "&full=" + encodeURIComponent(need.join(",")), {cache: "no-store", signal: ac.signal});
    clearTimeout(to);
    const s = await r.json();
    for (const d of (s.panes || []).concat(Object.values(s.extra || {}))){
      if (!d) continue;
      const c = BARS[d.symbol];
      HVER[d.symbol] = d.hist_ver;
      if (d.bars_full){ BARS[d.symbol] = {bars: d.bars || [], daily: d.daily || [], ver: d.hist_ver}; continue; }
      if (!c){ d.daily = []; continue; }   // only the live tail came: show it, never keep it as the history
      // the tail must join onto what we hold (no missing minutes); if not, fetch the full history next poll
      const tb = (d.bars || [])[0], lastC = c.bars.length ? c.bars[c.bars.length - 1][0] : null;
      if (tb && lastC != null && tb[0] > lastC + 60){ c.ver = -1; d.bars = c.bars.concat(d.bars); d.daily = c.daily; continue; }
      // merge the tail: replace bars we have by timestamp, append new ones
      for (const b of d.bars || []){ const i = c.bars.findIndex(x => x[0] >= b[0]); if (i < 0) c.bars.push(b); else if (c.bars[i][0] === b[0]) c.bars[i] = b; else c.bars.splice(i, 0, b); }
      if (c.bars.length > 2600) c.bars.splice(0, c.bars.length - 2600);
      d.bars = c.bars; d.daily = c.daily;
    }
    render(s);
    lastGood = Date.now();
  } catch (e){ document.querySelector("#stConn b").textContent = "DASHBOARD LOST CONTACT WITH TED"; document.querySelector("#stConn .led").className = "led bad"; }

  const lost = Date.now() - lastGood > 2000;
  document.body.classList.toggle("stale", lost);

}
