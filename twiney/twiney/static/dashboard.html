<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWINEY</title>
<style>
:root{
  --bg:#0a0d12; --panel:#11161f; --panel2:#161d29; --line:#243044; --text:#dbe3ee; --dim:#7b889e;
  --buy:#26d07c; --sell:#ff4d5e; --gold:#ffc53d; --cyan:#3fd0ff; --violet:#b58cff; --warn:#f0b429;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.on{border-color:var(--gold);color:var(--gold)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:#0d121a;position:sticky;top:0;z-index:5}
h1{font-size:16px;letter-spacing:.14em;margin:0 6px 0 0}
.pill{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;white-space:nowrap}
.pill.ok{border-color:var(--buy);color:var(--buy)} .pill.bad{border-color:var(--sell);color:var(--sell)}
.pill.warn{border-color:var(--warn);color:var(--warn)} .pill.ro{border-color:var(--violet);color:var(--violet)}
.dim{color:var(--dim)} .mono{font-family:var(--mono)} .spacer{flex:1}
main{padding:10px 16px;display:grid;gap:10px}

/* plain-English feed */
#feed{display:grid;gap:4px;max-height:128px;overflow-y:auto}
.say{padding:6px 10px;border-radius:6px;background:var(--panel);border-left:4px solid var(--dim);font-size:14px}
.say b{letter-spacing:.02em}
.say.buyer{border-color:var(--buy)} .say.seller{border-color:var(--sell)}
.say.cleaned{border-color:var(--gold)} .say.pulled{border-color:var(--violet)}
.say.fresh{background:#1a2230}
.say .age{float:right;color:var(--dim);font-size:11px;margin-left:10px}

/* panes */
#panes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;
  flex:1 1 600px;min-width:340px;min-height:520px;height:780px;resize:both;overflow:hidden;position:relative}
.pane.sized{flex:0 0 auto}
.pane.pinned{border-color:var(--gold)}
.p-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px 4px}
.p-head .sym{font-size:20px;font-weight:700;letter-spacing:.03em}
.p-quote{font-family:var(--mono);font-size:12px}
.p-changed{margin:0 10px;padding:4px 8px;border-radius:5px;background:#3a2f0a;color:var(--gold);font-size:12px}
.p-say{margin:4px 10px;padding:8px 10px;border-radius:6px;background:var(--panel2);border-left:5px solid var(--dim);font-size:15px;font-weight:600}
.p-say.reload{border-color:var(--warn);background:#2a2412} .p-say.cleaned{border-color:var(--gold);background:#2b2610}
.p-say.pulled{border-color:var(--violet);background:#221a33} .p-say.watch{border-color:var(--cyan)}
.p-say.at{border-color:var(--gold)} .p-say.near{border-color:var(--cyan)}
.p-lines{margin:0 10px 4px 26px;padding:0;font-size:12.5px;color:#c4cddb;max-height:78px;overflow-y:auto;flex:0 0 auto}
.p-lines li{margin:1px 0}
.p-body{flex:1 1 0;display:grid;grid-template-columns:minmax(0,1fr) 8px var(--ladder-w,340px);grid-template-rows:minmax(0,1fr);gap:4px;padding:4px 10px;min-height:300px}
.chart-wrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-tools{position:absolute;top:4px;left:6px;display:flex;gap:4px;z-index:2}
.chart-tools button{padding:1px 6px;font-size:11px;background:rgba(17,22,31,.85)}
.chart-wrap canvas{cursor:crosshair}
.chart-wrap canvas.pan{cursor:grabbing}
.chart-hint{position:absolute;right:6px;bottom:22px;font-size:10px;color:var(--dim);pointer-events:none;background:rgba(17,22,31,.7);padding:1px 4px;border-radius:3px}
.divider{width:8px;cursor:col-resize;border-radius:4px;background:transparent}
.divider:hover,.divider.on{background:var(--line)}
.p-head .grab{cursor:grab;color:var(--dim);font-size:16px;padding:0 4px;user-select:none}
.p-head .grab:active{cursor:grabbing}
.pane.dragging{opacity:.4}
.pane.dropzone{outline:2px dashed var(--gold)}
.pane.max{position:fixed;inset:8px;z-index:10;height:auto !important;width:auto !important;resize:none}
body.has-max #panes .pane:not(.max){visibility:hidden}
.ladder-wrap{overflow-y:auto;border:1px solid var(--line);border-radius:6px;min-height:0;height:100%}
.p-tape{flex:0 0 auto;max-height:130px;overflow-y:auto;margin:4px 10px 8px;border-top:1px solid var(--line)}
.empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--dim);text-align:center;padding:20px}

/* level-memory ladder */
.lad{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.lad th{position:sticky;top:0;background:#0f141c;color:var(--dim);font-weight:500;font-size:10px;padding:3px 2px;z-index:3}
.lad td{padding:1px 3px;height:19px;white-space:nowrap}
.lad .px{text-align:center;font-weight:600;color:#cfd8e6;border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
.lad .sz{text-align:right;width:46px}
.lad .ask .sz,.lad td.asz{text-align:left}
.lad td.bars{width:28%;position:relative}
.bar{position:absolute;top:3px;bottom:3px;border-radius:2px}
.bar.sold{right:2px;background:rgba(38,208,124,.55)}
.bar.bought{left:2px;background:rgba(255,77,94,.55)}
.bar-n{position:relative;font-size:10px;color:#e8eef7;z-index:1}
td.bars.l .bar-n{float:right;margin-right:3px} td.bars.r .bar-n{margin-left:3px}
.pips{font-size:9px;letter-spacing:-1px}
.pips.b{color:var(--buy)} .pips.a{color:var(--sell)}
.lad tr.gap td{border-top:2px dashed var(--line)}
.lad tr.best-bid td.bsz{color:var(--buy);font-weight:700}
.lad tr.best-ask td.asz{color:var(--sell);font-weight:700}
.lad tr.lvl td.px{background:rgba(255,197,61,.18);color:var(--gold)}
.lad tr.lvl td{border-top:1px solid rgba(255,197,61,.45);border-bottom:1px solid rgba(255,197,61,.45)}
.lad tr.lastpx td.px::before{content:"▶";position:absolute;left:2px;color:var(--text)}
.mine{display:inline-block;font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;border:1px solid #fff;color:#fff;margin-left:3px}
.trap{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em}
.trap.l{background:#3a1216;color:#ffb3bb;border:1px solid var(--sell)} .trap.s{background:#0f3d25;color:#9fffcf;border:1px solid var(--buy)}
.trap.heavy{animation:trapglow 1.4s infinite}
@keyframes trapglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 10px 1px currentColor}}
.io{font-size:9px;font-weight:800;padding:0 3px;border-radius:2px;margin-left:4px}
.io.in{background:var(--buy);color:#04210f} .io.out{background:var(--sell);color:#2a0409}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;background:var(--gold);color:#1a1300;margin-left:3px}
.who{display:inline-block;font-size:9.5px;font-weight:800;padding:0 4px;border-radius:3px;margin:0 2px}
.who.buyer{background:var(--buy);color:#04210f} .who.seller{background:var(--sell);color:#2a0409}
.who.cand{background:transparent;border:1px solid currentColor}
.who.buyer.cand{color:var(--buy)} .who.seller.cand{color:var(--sell)}
.who.v{background:var(--violet);color:#150a2a} .who.c{background:var(--gold);color:#1a1300}
@keyframes glowb{0%,100%{box-shadow:inset 0 0 0 1px rgba(38,208,124,.4)}50%{box-shadow:inset 0 0 12px 2px rgba(38,208,124,.9)}}
@keyframes glowa{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,77,94,.4)}50%{box-shadow:inset 0 0 12px 2px rgba(255,77,94,.9)}}
.lad tr.rl-bid td{animation:glowb 1.6s infinite}
.lad tr.rl-ask td{animation:glowa 1.6s infinite}
.legend{font-size:10.5px;color:var(--dim);padding:4px 6px;border-top:1px solid var(--line)}
/* trading */
.lad td.act{width:58px;text-align:center;cursor:pointer;user-select:none;font-size:10.5px;color:transparent;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.lad td.act.b:hover{background:rgba(38,208,124,.25);color:#dfffee}
.lad td.act.s:hover{background:rgba(255,77,94,.25);color:#ffe3e6}
.lad td.act.disabled{cursor:not-allowed}
.lad td.act.disabled:hover{background:rgba(123,136,158,.15);color:var(--dim)}
.lad th.act{color:var(--dim)}
.chip{display:inline-block;padding:0 5px;border-radius:3px;font-weight:800;font-size:10.5px;cursor:pointer;color:#0a0d12}
.chip.b{background:var(--buy)} .chip.s{background:var(--sell)} .chip.wait{opacity:.6}
.chip:hover::after{content:" ✕"}
.tradebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 10px 4px;padding:6px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.tradebar input{width:64px;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 6px;text-align:right}
.tradebar .bbuy{background:#0f3d25;border-color:var(--buy);color:#dfffee;font-weight:700}
.tradebar .bsell{background:#4a161b;border-color:var(--sell);color:#ffe3e6;font-weight:700}
.tradebar .bflat{border-color:var(--gold);color:var(--gold)}
.tradebar button:disabled{opacity:.4;cursor:not-allowed}
.tradebar .pos{font-family:var(--mono);font-size:12px}
#arm{font-weight:800;letter-spacing:.06em;padding:4px 12px}
#arm.armed{background:#5a1218;border-color:var(--sell);color:#fff}
#arm.off{background:#1b2a1f;border-color:var(--buy);color:var(--buy)}
#mode.sim{border-color:var(--cyan);color:var(--cyan)} #mode.paper{border-color:var(--gold);color:var(--gold)}
#mode.live{border-color:var(--sell);color:var(--sell)} #mode.none{color:var(--dim)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:6px;z-index:20;max-width:420px}
.toast{padding:8px 12px;border-radius:6px;background:#1a2230;border-left:4px solid var(--buy);font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.toast.bad{border-color:var(--sell)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:320px;max-width:92vw}
#modal h2{margin:0 0 8px;font-size:22px}
#modal .legs{color:var(--dim);margin:4px 0 12px}
#modal .btns{display:flex;gap:8px;justify-content:flex-end}
#modal .send{font-weight:800;padding:6px 16px}
#modal .send.b{background:#0f3d25;border-color:var(--buy);color:#dfffee} #modal .send.s{background:#4a161b;border-color:var(--sell);color:#ffe3e6}

/* tables */
table.t{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
table.t th{color:var(--dim);font-weight:500;text-align:right;padding:3px 5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
table.t td{text-align:right;padding:2px 5px;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
.buy{color:var(--buy)} .sell{color:var(--sell)} .mid{color:var(--dim)}
.large{font-weight:700;text-decoration:underline}
tr.atlvl td{background:rgba(255,197,61,.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.card h3{margin:0 0 6px;font-size:11px;color:var(--dim);letter-spacing:.08em}
#bottom{display:grid;grid-template-columns:2fr 1fr;gap:10px}
#account{display:grid;grid-template-columns:3fr 2fr 2fr;gap:14px}
#account h4{margin:0 0 4px;font-size:11px;color:var(--dim);font-weight:600}
@media (max-width:1100px){#account{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
.msg-error{color:var(--sell)} .msg-warn{color:var(--warn)} .msg-info{color:var(--dim)}
tr.onslot td:first-child{color:var(--gold)}
td.status{text-align:left !important;white-space:normal !important;color:#c4cddb}
@media (max-width:900px){#bottom{grid-template-columns:1fr} .p-body{grid-template-columns:1fr} .divider{display:none} .pane{height:auto;resize:none;flex:1 1 100%} .chart-wrap{height:260px}}
</style>
</head>
<body>
<header>
  <h1>TWINEY</h1>
  <span class="pill none" id="mode">…</span>
  <button id="arm" class="off" title="Nothing can be sent while DISARMED">ARM</button>
  <span class="pill" id="conn">…</span>
  <span class="pill" id="mdt"></span>
  <span class="dim mono" id="meta"></span>
  <span class="spacer"></span>
  <label class="dim" title="Skip the confirmation box on every order"><input type="checkbox" id="oneclick"> one-click</label>
  <label class="dim" title="Attach the play's stop and target to every entry"><input type="checkbox" id="bracket"> stop+target</label>
  <button id="rotate" title="When OFF, ladders never switch symbols on their own">Auto-rotate: …</button>
  <button id="resetLayout" title="Forget pane sizes">Reset layout</button>
</header>
<div id="toasts"></div>
<main>
  <section id="feed"></section>
  <section id="panes"></section>
  <section class="card" id="account-card">
    <h3>YOUR ORDERS · POSITIONS · FILLS <span class="dim" style="letter-spacing:0">— click ✕ to cancel an order. Orders placed in TWS show up here too.</span></h3>
    <div id="account"></div>
  </section>
  <section id="bottom">
    <div class="card"><h3>YOUR PS60 PLAYS — CLOSEST FIRST</h3><div class="scroll" id="ranking"></div></div>
    <div class="card"><h3>FEED MESSAGES</h3><div id="messages"></div></div>
  </section>
</main>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const px = v => v == null ? "—" : Number(v).toFixed(Number(v) >= 1 ? 2 : 4);
const sz = v => v == null ? "—" : Number(v).toLocaleString();
const kfmt = v => !v ? "" : v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1e4 ? Math.round(v/1e3)+"k" : v >= 1e3 ? (v/1e3).toFixed(1)+"k" : String(Math.round(v));
const ago = s => s == null ? "—" : s < 60 ? s.toFixed(0) + "s" : (s/60).toFixed(1) + "m";
const MDT = {1:"LIVE",2:"FROZEN",3:"DELAYED",4:"DELAYED-FROZEN"};
const store = {
  get(k, d){ try { const v = localStorage.getItem("twiney." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("twiney." + k, JSON.stringify(v)); } catch(e){} },
  clear(){ try { Object.keys(localStorage).filter(k => k.startsWith("twiney.")).forEach(k => localStorage.removeItem(k)); } catch(e){} }
};
let state = null;

async function post(path, body){
  let out = null;
  try {
    const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    out = await r.json();
  } catch(e){ out = {ok:false, reason:"lost contact with TWINEY"}; }
  poll(true);
  return out;
}
function toast(text, ok){
  const el = document.createElement("div");
  el.className = "toast " + (ok ? "" : "bad");
  el.textContent = text;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), ok ? 4000 : 7000);
}

/* ---------- order entry ---------- */
function T(){ return (state && state.trading) || {}; }
function canTrade(){ const t = T(); return !!(t.can_trade && t.armed); }
function whyNot(){ return T().why_not || "not ready"; }

async function sendOrder(symbol, action, price, qty){
  const t = T();
  qty = qty || t.default_shares;
  if (!canTrade()){ toast("Can't trade: " + whyNot(), false); return; }
  const go = async () => {
    const out = await post("/api/trade/order", {symbol, action, price, qty});
    toast(out.ok ? "Sent: " + out.sent : "Blocked: " + out.reason, out.ok);
  };
  if (t.one_click) return go();
  const pane = (state.panes || []).find(d => d && d.symbol === symbol);
  const pl = pane ? pane.play : {};
  const legs = [];
  if (t.bracket){
    if (pl.stop && (action === "BUY" ? pl.stop < price : pl.stop > price)) legs.push("stop " + px(pl.stop));
    if (pl.target && (action === "BUY" ? pl.target > price : pl.target < price)) legs.push("target " + px(pl.target));
  }
  confirmBox(`${action} ${sz(qty)} ${symbol} @ ${px(price)}`, `about $${sz(Math.round(qty * price))}` + (legs.length ? " · with " + legs.join(" + ") : " · no stop/target attached"),
    action === "BUY" ? "b" : "s", go);
}
function confirmBox(title, legs, cls, onSend){
  const old = document.getElementById("modal"); if (old) old.remove();
  const m = document.createElement("div"); m.id = "modal";
  m.innerHTML = `<div class="box"><h2>${esc(title)}</h2><div class="legs">${esc(legs)}</div>
    <div class="btns"><button class="no">Cancel (Esc)</button><button class="send ${cls}">SEND (Enter)</button></div></div>`;
  const close = () => { m.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "Enter"){ close(); onSend(); } };
  m.querySelector(".no").onclick = close;
  m.querySelector(".send").onclick = () => { close(); onSend(); };
  m.onclick = e => { if (e.target === m) close(); };
  document.addEventListener("keydown", key);
  document.body.appendChild(m);
  m.querySelector(".send").focus();
}
async function cancelMine(id){
  const out = await post("/api/trade/cancel", {id});
  toast(out.ok ? "Cancel sent" : "Cancel failed: " + (out.reason || ""), out.ok);
}
async function flatten(symbol){
  if (!canTrade()){ toast("Can't trade: " + whyNot(), false); return; }
  confirmBox(`FLATTEN ${symbol}`, "closes the whole position with a limit through the market and cancels its working orders", "s", async () => {
    const out = await post("/api/trade/flatten", {symbol});
    toast(out.ok ? (out.flat ? symbol + " already flat" : "Sent: " + out.sent) : "Failed: " + out.reason, out.ok);
  });
}
async function cancelAll(symbol){
  const out = await post("/api/trade/cancel_all", {symbol});
  toast(`Cancelled ${out.cancelled} working order${out.cancelled === 1 ? "" : "s"}`, true);
}

/* ---------- panes: fixed DOM per screen position ---------- */
const panesEl = document.getElementById("panes");
const paneEls = [];

function ensurePane(i){
  if (paneEls[i]) return paneEls[i];
  const el = document.createElement("div");
  el.className = "pane";
  el.innerHTML = `
    <div class="p-head"></div>
    <div class="p-changed" hidden></div>
    <div class="p-say"></div>
    <ul class="p-lines"></ul>
    <div class="tradebar"></div>
    <div class="p-body">
      <div class="chart-wrap"><div class="chart-tools"></div><canvas></canvas><div class="chart-hint">wheel = zoom · drag = pan · drag price axis = stretch · dbl-click = reset</div></div>
      <div class="divider" title="drag to resize chart / ladder"></div>
      <div class="ladder-wrap"></div>
    </div>
    <div class="p-tape"></div>
    <div class="empty" hidden></div>`;
  const saved = store.get("pane." + i, null);
  if (saved && window.innerWidth > 900){ el.style.width = saved.w + "px"; el.style.height = saved.h + "px"; el.classList.add("sized"); }
  panesEl.appendChild(el);
  const p = {el, i, head: el.querySelector(".p-head"), changed: el.querySelector(".p-changed"),
    say: el.querySelector(".p-say"), lines: el.querySelector(".p-lines"), body: el.querySelector(".p-body"),
    tradebar: el.querySelector(".tradebar"),
    canvas: el.querySelector("canvas"), tools: el.querySelector(".chart-tools"),
    ladder: el.querySelector(".ladder-wrap"), tape: el.querySelector(".p-tape"), empty: el.querySelector(".empty"),
    divider: el.querySelector(".divider"),
    view: Object.assign({cw: 7, offset: 0, yLo: null, yHi: null, follow: true, cross: null}, store.get("view." + i, {})),
    data: null};
  const lw = store.get("ladder." + i, null);
  if (lw) p.body.style.setProperty("--ladder-w", lw + "px");
  // chart / ladder divider
  p.divider.addEventListener("mousedown", e => {
    e.preventDefault(); p.divider.classList.add("on");
    const move = ev => {
      const r = p.body.getBoundingClientRect();
      const w = Math.max(220, Math.min(r.right - ev.clientX - 10, r.width - 260));
      p.body.style.setProperty("--ladder-w", w + "px"); store.set("ladder." + i, Math.round(w)); drawChart(p);
    };
    const up = () => { p.divider.classList.remove("on"); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  });
  // chart interaction: wheel zoom, drag pan, price-axis stretch, crosshair, double-click reset
  const cv = p.canvas, v = p.view;
  const saveView = () => store.set("view." + i, {cw: v.cw, offset: v.offset, yLo: v.yLo, yHi: v.yHi, follow: v.follow});
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
    if (x > r.width - 86){                       // over the price axis: stretch / squeeze prices
      if (p.chartY){ const [lo, hi] = p.chartY; const c = (lo + hi) / 2, f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
        v.yLo = c - (c - lo) * f; v.yHi = c + (hi - c) * f; }
    } else {
      const f = e.deltaY > 0 ? 1 / 1.2 : 1.2;
      v.cw = Math.max(2, Math.min(40, v.cw * f));
    }
    saveView(); drawChart(p);
  }, {passive: false});
  cv.addEventListener("mousedown", e => {
    const r = cv.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY, onAxis = (e.clientX - r.left) > r.width - 86;
    const start = {offset: v.offset, yLo: v.yLo, yHi: v.yHi, y: p.chartY ? p.chartY.slice() : null, h: p.chartH || 1};
    let moved = false;
    cv.classList.add("pan");
    const move = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (onAxis && start.y){ const [lo, hi] = start.y; const c = (lo + hi) / 2, f = Math.exp(dy / 150);
        v.yLo = c - (c - lo) * f; v.yHi = c + (hi - c) * f; }
      else {
        v.offset = Math.max(0, start.offset + dx / v.cw);
        v.follow = v.offset < 0.5;
        if (start.y && !onAxis){ const [lo, hi] = start.y; const per = (hi - lo) / start.h; v.yLo = lo + dy * per; v.yHi = hi + dy * per; }
      }
      drawChart(p);
    };
    const up = () => { cv.classList.remove("pan"); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); if (moved) saveView(); };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  });
  cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); v.cross = [e.clientX - r.left, e.clientY - r.top]; drawChart(p); });
  cv.addEventListener("mouseleave", () => { v.cross = null; drawChart(p); });
  cv.addEventListener("dblclick", () => { v.cw = 7; v.offset = 0; v.yLo = v.yHi = null; v.follow = true; saveView(); drawChart(p); });
  // drag panes to reorder (by the ⠿ handle)
  el.addEventListener("dragstart", e => { if (!e.target.closest(".grab") && !el.classList.contains("dragging")) { e.preventDefault(); return; } e.dataTransfer.setData("text/plain", String(i)); el.classList.add("dragging"); });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("dropzone"); });
  el.addEventListener("dragleave", () => el.classList.remove("dropzone"));
  el.addEventListener("drop", e => {
    e.preventDefault(); el.classList.remove("dropzone");
    const from = +e.dataTransfer.getData("text/plain");
    if (from !== i && paneEls[from]) swapPanes(from, i);
  });
  // remember user-resized pane sizes
  let userSized = !!saved;
  el.addEventListener("mousedown", e => {
    const r = el.getBoundingClientRect();
    if (e.clientX > r.right - 22 && e.clientY > r.bottom - 22) userSized = true;
  });
  new ResizeObserver(() => {
    if (userSized && window.innerWidth > 900){
      el.classList.add("sized");
      store.set("pane." + i, {w: el.offsetWidth, h: el.offsetHeight});
    }
    drawChart(p);
  }).observe(el);
  p.tools.addEventListener("click", e => {
    const tf = e.target.dataset.tf;
    if (tf){ store.set("tf." + i, +tf); v.offset = 0; v.follow = true; drawChart(p); renderTools(p); }
    if (e.target.dataset.fit){ const n = aggBars(p.data ? p.data.bars : [], store.get("tf." + i, 1)).length || 1;
      v.cw = Math.max(2, Math.min(40, (cv.clientWidth - 86) / n)); v.offset = 0; v.follow = true; v.yLo = v.yHi = null; saveView(); drawChart(p); }
  });
  p.head.addEventListener("click", e => {
    const b = e.target.closest("button[data-pin]");
    if (b) post("/api/pin", {symbol: b.dataset.pin, pinned: b.dataset.on === "1"});
    if (e.target.closest("button[data-max]")){
      const on = !el.classList.contains("max");
      paneEls.forEach(q => q.el.classList.remove("max"));
      el.classList.toggle("max", on); document.body.classList.toggle("has-max", on);
      setTimeout(() => drawChart(p), 50);
    }
  });
  p.head.addEventListener("mousedown", e => { el.draggable = !!e.target.closest(".grab"); });
  p.ladder.addEventListener("click", e => {
    const chip = e.target.closest(".chip[data-id]");
    if (chip){ cancelMine(+chip.dataset.id); return; }
    const cell = e.target.closest("td.act");
    if (cell && p.data){ sendOrder(p.data.symbol, cell.dataset.act, +cell.dataset.px); }
  });
  p.tradebar.addEventListener("click", e => {
    const b = e.target.closest("button[data-do]");
    if (!b || !p.data) return;
    const d = p.data, qty = +p.tradebar.querySelector("input").value || T().default_shares;
    if (b.dataset.do === "buy" && d.bid) sendOrder(d.symbol, "BUY", d.bid, qty);
    if (b.dataset.do === "sell" && d.ask) sendOrder(d.symbol, "SELL", d.ask, qty);
    if (b.dataset.do === "flat") flatten(d.symbol);
    if (b.dataset.do === "cxl") cancelAll(d.symbol);
  });
  p.tradebar.addEventListener("change", e => {
    if (e.target.tagName === "INPUT") post("/api/trade/size", {shares: +e.target.value});
  });
  p.ladder.addEventListener("wheel", () => { p.userScroll = Date.now(); }, {passive: true});
  p.ladder.addEventListener("touchmove", () => { p.userScroll = Date.now(); }, {passive: true});
  paneEls[i] = p;
  renderTools(p);
  return p;
}

function renderTools(p){
  const tf = store.get("tf." + p.i, 1);
  p.tools.innerHTML = [1, 5, 15].map(m => `<button data-tf="${m}" class="${tf===m?"on":""}">${m}m</button>`).join("")
    + `<button data-fit="1" title="show all bars">fit</button>`;
}
function swapPanes(a, b){
  const order = store.get("order", null) || paneEls.map((_, k) => k);
  const ia = order.indexOf(a), ib = order.indexOf(b);
  [order[ia], order[ib]] = [order[ib], order[ia]];
  store.set("order", order);
  applyOrder();
}
function applyOrder(){
  const order = store.get("order", null);
  if (!order) return;
  for (const k of order) if (paneEls[k]) panesEl.appendChild(paneEls[k].el);
}

function pips(n, cls){
  if (!n) return "";
  const dots = "●".repeat(Math.min(n, 6)) + (n > 6 ? "+" + (n - 6) : "");
  return `<span class="pips ${cls}" title="size came back ${n}x after being hit">${dots}</span>`;
}

function whoTag(row, side){
  const st = row[side + "_state"], n = row[side + "_refills"] || 0, v = row[side + "_verdict"];
  const name = side === "bid" ? "buyer" : "seller";
  if (v === "CLEANED UP") return `<span class="who c">CLEANED</span>`;
  if (v === "PULLED") return `<span class="who v">PULLED</span>`;
  if (st === "RELOAD") return `<span class="who ${name}">${name.toUpperCase()} ×${n}</span>`;
  if (st === "BUILDING" && n >= 2) return `<span class="who ${name} cand">${name}?</span>`;
  return "";
}

function ladderHTML(L){
  if (!L || !L.rows.length) return `<div class="empty">Waiting for the book…</div>`;
  const ms = Math.max(L.max_traded, 1);
  const on = canTrade(), dis = on ? "" : " disabled";
  const chips = (r, side) => (r.mine || []).filter(o => (o.action === "BUY") === (side === "b")).map(o =>
    `<span class="chip ${side} ${o.status === "PreSubmitted" ? "wait" : ""}" data-id="${o.id}" title="${esc(o.role)} order — click to cancel">${sz(o.qty)}</span>`).join(" ");
  let h = `<table class="lad"><tr>
    <th class="act" title="Click a price here to BUY at that price">BUY</th>
    <th title="Shares sold INTO the bid at this price (last ${L.memory_minutes} min). Big green = a buyer absorbing.">SOLD INTO BID</th>
    <th>BID</th><th>PRICE</th><th>ASK</th>
    <th title="Shares bought FROM the ask at this price (last ${L.memory_minutes} min). Big red = a seller absorbing.">BOUGHT AT ASK</th>
    <th class="act" title="Click a price here to SELL at that price">SELL</th></tr>`;
  for (const r of L.rows){
    const cls = [r.gap?"gap":"", r.best_bid?"best-bid":"", r.best_ask?"best-ask":"", r.tags.length?"lvl":"", r.last?"lastpx":"",
      r.bid_state==="RELOAD"?"rl-bid":"", r.ask_state==="RELOAD"?"rl-ask":""].join(" ");
    const sw = r.sold ? Math.max(4, 100 * r.sold / ms) : 0, bw = r.bought ? Math.max(4, 100 * r.bought / ms) : 0;
    h += `<tr class="${cls}">
      <td class="act b${dis}" data-act="BUY" data-px="${r.price}" title="${on ? "BUY " + sz(T().default_shares) + " @ " + px(r.price) : whyNot()}">${chips(r, "b") || "BUY"}</td>
      <td class="bars l">${sw?`<span class="bar sold" style="width:${sw}%"></span>`:""}<span class="bar-n">${kfmt(r.sold)}</span></td>
      <td class="sz bsz">${whoTag(r,"bid")}${pips(r.bid_refills,"b")} ${r.bid?kfmt(r.bid):""}</td>
      <td class="px">${px(r.price)}${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</td>
      <td class="sz asz">${r.ask?kfmt(r.ask):""} ${pips(r.ask_refills,"a")}${whoTag(r,"ask")}</td>
      <td class="bars r">${bw?`<span class="bar bought" style="width:${bw}%"></span>`:""}<span class="bar-n">${kfmt(r.bought)}</span></td>
      <td class="act s${dis}" data-act="SELL" data-px="${r.price}" title="${on ? "SELL " + sz(T().default_shares) + " @ " + px(r.price) : whyNot()}">${chips(r, "s") || "SELL"}</td></tr>`;
  }
  h += `</table><div class="legend">Every row remembers the last ${L.memory_minutes} min. <span class="buy">Green bar</span> = shares sold into the bid there,
    <span class="sell">red bar</span> = shares bought from the ask. <span class="pips b">●</span><span class="pips a">●</span> = times the size came back after being hit.
    A glowing row = a reload is confirmed there. Gold rows = your levels. Click BUY / SELL on a row to place a limit there; click your order chip to cancel it.</div>`;
  return h;
}

function tapeHTML(t){
  const rows = t.recent.map(r => `<tr class="${r.at?"atlvl":""}"><td class="dim">${ago(r.age)}${r.side==="buy"?`<span class="io in" title="paid the offer — wanted in now">IN</span>`:r.side==="sell"?`<span class="io out" title="hit the bid — wanted out now">OUT</span>`:""}</td>
    <td class="${r.side}">${px(r.price)}${r.at?` <span class="tag">${esc(r.at)}</span>`:""}</td>
    <td class="${r.side} ${r.large?"large":""}">${sz(r.size)}</td><td class="dim">${esc(r.exchange)}</td></tr>`).join("")
    || `<tr><td colspan="4" class="dim">no prints yet</td></tr>`;
  return `<table class="t"><tr><th>TIME & SALES <span class="dim" style="font-weight:400">IN = paid the offer · OUT = hit the bid</span></th><th>PRICE</th><th>SIZE</th><th>EX</th></tr>${rows}</table>`;
}

    <span class="pill ${hcls}">${esc(h.status)}</span>

    ${d.position ? `<span class="pill ${d.position.pnl >= 0 ? "ok" : "bad"}">POS ${d.position.qty > 0 ? "+" : ""}${sz(d.position.qty)} @ ${px(d.position.avg_cost)}${d.position.pnl != null ? ` · ${d.position.pnl >= 0 ? "+" : "−"}$${sz(Math.abs(d.position.pnl).toFixed(0))}` : ""}</span>` : ""}
    ${d.orders.length ? `<span class="pill">${d.orders.length} working order${d.orders.length > 1 ? "s" : ""}</span>` : ""}
    ${d.trap && d.trap.longs ? `<span class="trap l ${d.trap.longs.heavy ? "heavy" : ""}" title="bought the offer above here in the last ${d.trap.window_minutes} min, now underwater">${kfmt(d.trap.longs.shares)} LONGS TRAPPED above ${px(d.trap.longs.low)}</span>` : ""}
    ${d.trap && d.trap.shorts ? `<span class="trap s ${d.trap.shorts.heavy ? "heavy" : ""}" title="hit the bid below here in the last ${d.trap.window_minutes} min, now underwater">${kfmt(d.trap.shorts.shares)} SHORTS TRAPPED below ${px(d.trap.shorts.high)}</span>` : ""}`;
  const t = T(), on = canTrade();
  const pos = d.position;

    <button class="bbuy" data-do="buy" ${on && d.bid ? "" : "disabled"} title="${on ? "Buy on the bid " + px(d.bid) : whyNot()}">BUY bid ${px(d.bid)}</button>

    <button class="bflat" data-do="flat" ${on && pos ? "" : "disabled"}>Flatten</button>
    <button data-do="cxl" ${d.orders.length ? "" : "disabled"}>Cancel all (${d.orders.length})</button>
    <span class="pos">${pos ? `<span class="${pos.qty > 0 ? "buy" : "sell"}">${pos.qty > 0 ? "LONG" : "SHORT"} ${sz(Math.abs(pos.qty))}</span> @ ${px(pos.avg_cost)}${pos.pnl != null ? ` · <span class="${pos.pnl >= 0 ? "buy" : "sell"}">${pos.pnl >= 0 ? "+" : "−"}$${sz(Math.abs(pos.pnl).toFixed(0))}</span>` : ""}` : `<span class="dim">flat</span>`}</span>
    ${!on ? `<span class="dim" style="font-size:11px">${esc(whyNot())}</span>` : ""}`;
  if (d.changed){
    p.changed.hidden = false;
    p.changed.textContent = `This ladder switched from ${d.changed.prev} to ${d.symbol} (${d.changed.reason === "pinned" ? "you pinned it" : "it is closer to its level"}) ${ago(state.now - d.changed.t)} ago.`;
  } else p.changed.hidden = true;
  p.say.className = "p-say " + (d.tone || "");
  p.say.textContent = d.headline;

  const keep = p.ladder.scrollTop;

/* ---------- chart: candles + your levels + absorption bubbles ---------- */
function aggBars(bars, tf){
  if (tf === 1) return bars.map(b => b.slice());
  const out = [], span = tf * 60;
  for (const b of bars){
    const t0 = Math.floor(b[0] / span) * span, last = out[out.length - 1];
    if (last && last[0] === t0){ last[2] = Math.max(last[2], b[2]); last[3] = Math.min(last[3], b[3]); last[4] = b[4]; last[5] += b[5]; last[6] += b[6]; last[7] += b[7]; }
    else out.push([t0, b[1], b[2], b[3], b[4], b[5], b[6], b[7]]);
  }
  return out;
}

const LEVEL_STYLE = {trigger:["#ffc53d",[],2], second_entry:["#3fd0ff",[6,4],1.6], extra:["#b9c3d3",[3,4],1.2],
  target:["#26d07c",[2,4],1], stop:["#ff4d5e",[2,4],1]};

function drawChart(p){
  const d = p.data, cv = p.canvas;
  if (!d || p.body.hidden) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const tf = store.get("tf." + p.i, 1), span = tf * 60;
  const labelW = 86, plotW = W - labelW, volH = Math.max(28, H * 0.16), plotH = H - volH - 18;
  const v = p.view, cw = v.cw;
  const all = aggBars(d.bars, tf);
  const n = Math.max(5, Math.floor(plotW / cw));
  const off = Math.min(Math.round(v.offset), Math.max(0, all.length - 2));
  const bars = all.slice(Math.max(0, all.length - off - n), all.length - off);
  p.chartH = plotH;
  g.font = "11px ui-monospace, Menlo, Consolas, monospace";
  if (!bars.length){
    g.fillStyle = "#7b889e"; g.fillText("Chart builds as trades come in…", 12, 40);
  }
  // y range: bars plus your trigger / 2nd entry / levels so they are always on screen
  let lo = Infinity, hi = -Infinity;
  for (const b of bars){ lo = Math.min(lo, b[3]); hi = Math.max(hi, b[2]); }
  if (d.last){ lo = Math.min(lo, d.last); hi = Math.max(hi, d.last); }
  const core = d.user_levels.filter(l => ["trigger","second_entry","extra"].includes(l.role));
  for (const l of core){ lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); }
  // target / stop are drawn only when they fall inside this range (they never squash the chart)
  if (!isFinite(lo)) return;
  const pad = Math.max((hi - lo) * 0.08, lo * 0.0005);
  lo -= pad; hi += pad;
  if (v.yLo != null && v.yHi != null && v.yHi > v.yLo){ lo = v.yLo; hi = v.yHi; }
  p.chartY = [lo, hi];
  const y = v => 8 + (hi - v) / (hi - lo) * (plotH - 8);
  const x0 = plotW - bars.length * cw;
  const xOf = t0 => x0 + ((t0 - (bars.length ? bars[0][0] : 0)) / span) * cw + cw / 2;

  // grid
  g.strokeStyle = "#1b2433"; g.lineWidth = 1;
  for (let k = 0; k <= 4; k++){ const yy = 8 + k * (plotH - 8) / 4; g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke(); }

  // your levels: zone band + line + label
  const tickOf = v => v >= 1 ? 0.01 : 0.0001;
  for (const l of d.user_levels){
    if (l.price < lo || l.price > hi) continue;
    const [col, dash, lw] = LEVEL_STYLE[l.role] || LEVEL_STYLE.extra;
    const yy = y(l.price), band = Math.max(3, Math.abs(y(l.price + tickOf(l.price)) - yy));
    g.fillStyle = col + "22"; g.fillRect(0, yy - band, plotW, band * 2);
    g.strokeStyle = col; g.lineWidth = lw; g.setLineDash(dash);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke(); g.setLineDash([]);
    g.fillStyle = col; g.fillRect(plotW, yy - 8, labelW, 16);
    g.fillStyle = "#0a0d12"; g.fillText(`${l.label} ${px(l.price)}`.slice(0, 13), plotW + 3, yy + 4);
  }

  // trapped traders: shaded band where they got in
  if (d.trap){
    for (const [tp, col] of [[d.trap.longs, "255,77,94"], [d.trap.shorts, "38,208,124"]]){
      if (!tp) continue;
      const y1 = y(Math.min(hi, tp.high)), y2 = y(Math.max(lo, tp.low));
      g.fillStyle = `rgba(${col},${tp.heavy ? .16 : .09})`; g.fillRect(0, y1 - 2, plotW, Math.max(4, y2 - y1 + 4));
      g.fillStyle = `rgba(${col},.8)`; g.font = "bold 10px system-ui";
      g.fillText((tp === d.trap.longs ? "TRAPPED LONGS " : "TRAPPED SHORTS ") + kfmt(tp.shares), 6, tp === d.trap.longs ? y1 - 5 : y2 + 12);
      g.font = "11px ui-monospace, Menlo, Consolas, monospace";
    }
  }
  // reloaders: a bar on the left edge at their price
  if (d.reloaders){
    for (const r of [...d.reloaders.below, ...d.reloaders.above]){
      if (r.price < lo || r.price > hi) continue;
      const yy = y(r.price), col = r.side === "bid" ? "#26d07c" : "#ff4d5e";
      g.fillStyle = col; g.globalAlpha = r.kind === "confirmed" ? 1 : .45;
      g.fillRect(0, yy - 3, 5, 6);
      g.fillText((r.side === "bid" ? "B" : "S") + "×" + r.refills, 8, yy + 4);
      g.globalAlpha = 1;
    }
  }
  // candles
  for (let k = 0; k < bars.length; k++){
    const b = bars[k], x = x0 + k * cw + cw / 2, up = b[4] >= b[1];
    g.strokeStyle = g.fillStyle = up ? "#26d07c" : "#ff4d5e";
    g.beginPath(); g.moveTo(x, y(b[2])); g.lineTo(x, y(b[3])); g.stroke();
    const top = y(Math.max(b[1], b[4])), bh = Math.max(1, Math.abs(y(b[1]) - y(b[4])));
    g.fillRect(x - cw * 0.35, top, cw * 0.7, bh);
  }
  // volume, split buy / sell where known
  const vmax = Math.max(1, ...bars.map(b => b[5]));
  for (let k = 0; k < bars.length; k++){
    const b = bars[k], x = x0 + k * cw + cw * 0.15, base = H - 18, full = (b[5] / vmax) * (volH - 6);
    const known = b[6] + b[7];
    if (known > 0){
      const hb = full * b[6] / b[5], hs = full * b[7] / b[5];
      g.fillStyle = "#26d07c99"; g.fillRect(x, base - hb, cw * 0.7, hb);
      g.fillStyle = "#ff4d5e99"; g.fillRect(x, base - hb - hs, cw * 0.7, hs);
      g.fillStyle = "#7b889e55"; g.fillRect(x, base - full, cw * 0.7, full - hb - hs);
    } else { g.fillStyle = "#7b889e66"; g.fillRect(x, base - full, cw * 0.7, full); }
  }

  // absorption bubbles: shares traded into resting size at your levels / big levels
  if (bars.length){
    const first = bars[0][0], bucket = {};
    for (const [m, price, side, shares] of d.marks){
      const t0 = Math.floor(m / span) * span;
      if (t0 < first) continue;
      const key = t0 + "|" + price + "|" + side;
      bucket[key] = bucket[key] || [t0, price, side, 0];
      bucket[key][3] += shares;
    }
    const vals = Object.values(bucket), mx = Math.max(1, ...vals.map(v => v[3]));
    for (const [t0, price, side, shares] of vals){
      if (price < lo || price > hi) continue;
      const r = 3 + 11 * Math.sqrt(shares / mx);
      g.fillStyle = side === "bid" ? "rgba(38,208,124,.45)" : "rgba(255,77,94,.45)";
      g.strokeStyle = side === "bid" ? "#26d07c" : "#ff4d5e";
      g.beginPath(); g.arc(xOf(t0), y(price), r, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    // calls: R = reload, C = cleaned up, P = pulled
    for (const [t, price, label, side] of d.events){
      if (price < lo || price > hi) continue;
      const t0 = Math.floor(t / span) * span;
      if (t0 < first) continue;
      const letter = label.startsWith("RELOAD") ? "R" : label === "CLEANED UP" ? "C" : "P";
      const col = letter === "C" ? "#ffc53d" : letter === "P" ? "#b58cff" : side === "bid" ? "#26d07c" : "#ff4d5e";
      const xx = xOf(t0), yy = y(price) + (side === "bid" ? 16 : -16);
      g.fillStyle = col; g.beginPath(); g.arc(xx, yy, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#0a0d12"; g.font = "bold 10px system-ui"; g.fillText(letter, xx - 3.5, yy + 3.5);
      g.font = "11px ui-monospace, Menlo, Consolas, monospace";
    }
  }

  // your working orders
  for (const o of d.orders){
    if (!o.price || o.price < lo || o.price > hi) continue;
    const yy = y(o.price), col = o.action === "BUY" ? "#9fffcf" : "#ffb3bb";
    g.strokeStyle = col; g.lineWidth = 1.2; g.setLineDash([8, 3, 2, 3]);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#0a0d12"; g.strokeStyle = col; g.fillRect(plotW, yy - 8, labelW, 16); g.strokeRect(plotW + .5, yy - 7.5, labelW - 1, 15);
    g.fillStyle = col; g.fillText(`${o.role === "entry" ? "YOU " + o.action : o.role.toUpperCase()} ${sz(o.qty)}`.slice(0, 13), plotW + 3, yy + 4);
  }
  // last price
  if (d.last){
    const yy = y(d.last);
    g.strokeStyle = "#dbe3ee"; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#dbe3ee"; g.fillRect(plotW, yy - 8, labelW, 16);
    g.fillStyle = "#0a0d12"; g.fillText(`LAST ${px(d.last)}`, plotW + 3, yy + 4);
  }
  // time axis
  g.fillStyle = "#7b889e";
  const every = Math.max(1, Math.ceil(70 / cw));
  for (let k = 0; k < bars.length; k += every){
    const dt = new Date(bars[k][0] * 1000);
    g.fillText(dt.toTimeString().slice(0, 5), x0 + k * cw, H - 4);
  }
  // key
  g.fillStyle = "#7b889e";
  g.fillText("● green = buyer absorbing   ● red = seller absorbing   R/C/P = reload / cleaned / pulled", 60, H - volH - 4);
  if (off > 0){ g.fillStyle = "#ffc53d"; g.fillText(`◀ ${off} bars back — double-click to go live`, plotW - 230, 14); }
  // crosshair with price / time readout
  if (v.cross){
    const [cx, cy] = v.cross;
    if (cx < plotW && cy < plotH){
      g.strokeStyle = "#7b889e"; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, plotH); g.moveTo(0, cy); g.lineTo(plotW, cy); g.stroke(); g.setLineDash([]);
      const pr = hi - (cy - 8) / (plotH - 8) * (hi - lo);
      g.fillStyle = "#243044"; g.fillRect(plotW, cy - 8, labelW, 16);
      g.fillStyle = "#dbe3ee"; g.fillText(px(pr), plotW + 3, cy + 4);
      const k = Math.floor((cx - x0) / cw);
      if (bars[k]){
        const b = bars[k], dt = new Date(b[0] * 1000).toTimeString().slice(0, 5);
        const txt = `${dt}  O ${px(b[1])} H ${px(b[2])} L ${px(b[3])} C ${px(b[4])}  vol ${kfmt(b[5])}`;
        g.fillStyle = "rgba(17,22,31,.9)"; g.fillRect(6, 4, g.measureText(txt).width + 10, 16);
        g.fillStyle = "#dbe3ee"; g.fillText(txt, 11, 16);
      }
    }
  }
}

/* ---------- page ---------- */
function sayClass(a){ return a.label.includes("BUYER") ? "buyer" : a.label.includes("SELLER") ? "seller" : a.label === "CLEANED UP" ? "cleaned" : "pulled"; }

function render(s){
  state = s;
  const c = s.connection, conn = document.getElementById("conn");
  conn.textContent = c.state + (c.detail ? " · " + c.detail : "");
  conn.className = "pill " + (c.state==="CONNECTED"?"ok":["CONNECTING","REPLAY","DEMO"].includes(c.state)?"warn":"bad");
  document.getElementById("mdt").textContent = c.market_data_type ? "DATA " + (MDT[c.market_data_type]||c.market_data_type) : "";
  document.getElementById("meta").textContent = `${s.depth.length}/${s.slots} ladders · up ${ago(s.uptime)}`;
  const t = s.trading || {};
  const mode = document.getElementById("mode");
  const modeText = {SIM: "PRACTICE · simulator fills", PAPER: "PAPER account", LIVE: t.can_trade ? "LIVE ACCOUNT — REAL MONEY" : "LIVE account · trading locked", NONE: "no account yet"};
  mode.textContent = modeText[t.mode] || t.mode;
  mode.className = "pill " + (t.mode || "none").toLowerCase();
  const arm = document.getElementById("arm");
  arm.textContent = t.armed ? "ARMED — click to disarm" : "ARM";
  arm.className = t.armed ? "armed" : "off";
  arm.disabled = !t.can_trade;
  arm.title = t.can_trade ? "" : (t.why_not || "");
  document.getElementById("oneclick").checked = !!t.one_click;
  document.getElementById("bracket").checked = !!t.bracket;
  const rot = document.getElementById("rotate");
  rot.textContent = "Auto-rotate: " + (s.auto_rotate ? "ON" : "OFF");
  rot.className = s.auto_rotate ? "" : "on";

  document.getElementById("feed").innerHTML = s.alerts.length ? s.alerts.slice(0, 20).map(a => {
    const age = s.now - a.t;
    return `<div class="say ${sayClass(a)} ${age < 15 ? "fresh" : ""}"><span class="age">${ago(age)} ago</span><b>${esc(a.symbol)}</b> — ${esc(a.text || a.label)}</div>`;
  }).join("") : `<div class="say">No calls yet. TWINEY speaks only when the evidence is there: price approaching your level, a buyer or seller reloading, a level cleaned up or pulled.</div>`;

  s.panes.forEach((d, i) => renderPane(ensurePane(i), d));
  if (!panesEl.dataset.ordered){ applyOrder(); panesEl.dataset.ordered = "1"; }

  const rows = s.ranking.map(r => `<tr class="${r.depth?"onslot":""}">
    <td>${r.rank ?? "—"} ${esc(r.symbol)}${r.depth?" ◆":""}</td>
    <td class="${r.side==="long"?"buy":"sell"}">${esc(r.side)}</td>
    <td>${px(r.last)}</td><td style="color:var(--gold)">${px(r.trigger)}</td><td style="color:var(--cyan)">${px(r.second_entry)}</td>
    <td class="status">${esc(r.status)}</td>
    <td><button data-pin="${esc(r.symbol)}" data-on="${r.pinned?0:1}" class="${r.pinned?"on":""}">${r.pinned?"📌 Unpin":"Pin to ladder"}</button></td></tr>`).join("");
  document.getElementById("ranking").innerHTML = `<table class="t"><tr><th>#</th><th>SIDE</th><th>LAST</th><th>TRIGGER</th><th>2ND</th><th style="text-align:left">WHERE PRICE IS</th><th></th></tr>${rows}</table>`;

  const A = s.account;
  const pend = A.pending.map(o => `<tr><td>${esc(o.symbol)} <span class="dim">${esc(o.role || "")}</span></td><td class="${o.action==="BUY"?"buy":"sell"}">${esc(o.action)}</td>
    <td>${sz(o.remaining ?? o.qty)}${o.filled ? ` <span class="dim">(${sz(o.filled)} filled)</span>` : ""}</td><td>${esc(o.type)}</td>
    <td>${o.lmt ? px(o.lmt) : ""}${o.aux ? ` <span class="dim">stop ${px(o.aux)}</span>` : ""}</td><td class="dim">${esc(o.tif || "")}</td><td>${esc(o.status || "")}${o.order_id != null ? ` <button class="cxl" data-cxl="${o.order_id}">✕</button>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="7" class="dim">${A.seen ? "No working orders." : "Waiting for IBKR account data…"}</td></tr>`;
  const done = A.done.slice(0, 5).map(o => `<tr class="dim"><td>${esc(o.symbol)}</td><td>${esc(o.action)}</td><td>${sz(o.qty)}</td><td>${esc(o.type)}</td>
    <td>${o.lmt ? px(o.lmt) : ""}</td><td></td><td>${esc(o.status)}</td></tr>`).join("");
  const pos = A.positions.map(p => { const pnl = p.last ? (p.last - p.avg_cost) * p.qty : null;
    return `<tr><td>${esc(p.symbol)}</td><td class="${p.qty>0?"buy":"sell"}">${p.qty>0?"+":""}${sz(p.qty)}</td><td>${px(p.avg_cost)}</td><td>${px(p.last)}</td>
    <td class="${pnl==null?"":pnl>=0?"buy":"sell"}">${pnl==null?"—":(pnl>=0?"+":"−")+"$"+sz(Math.abs(pnl).toFixed(0))}</td></tr>`; }).join("")
    || `<tr><td colspan="5" class="dim">Flat.</td></tr>`;
  const fills = A.fills.map(f => `<tr><td class="dim">${esc(String(f.time).slice(-8))}</td><td>${esc(f.symbol)}</td>
    <td class="${f.side==="BOT"?"buy":"sell"}">${f.side==="BOT"?"BOUGHT":"SOLD"}</td><td>${sz(f.shares)}</td><td>${px(f.price)}</td></tr>`).join("")
    || `<tr><td colspan="5" class="dim">No fills today.</td></tr>`;
  document.getElementById("account").innerHTML = `
    <div><h4>PENDING ORDERS</h4><div class="scroll"><table class="t"><tr><th>SYMBOL</th><th>SIDE</th><th>QTY</th><th>TYPE</th><th>PRICE</th><th>TIF</th><th>STATUS</th></tr>${pend}${done}</table></div></div>
    <div><h4>POSITIONS</h4><div class="scroll"><table class="t"><tr><th>SYMBOL</th><th>QTY</th><th>AVG</th><th>LAST</th><th>P&amp;L</th></tr>${pos}</table></div></div>
    <div><h4>TODAY'S FILLS</h4><div class="scroll" style="max-height:170px;overflow-y:auto"><table class="t"><tr><th>TIME</th><th>SYMBOL</th><th>SIDE</th><th>QTY</th><th>PRICE</th></tr>${fills}</table></div></div>`;

  document.getElementById("messages").innerHTML = s.messages.map(m =>
    `<div class="msg-${esc(m.level)} mono" style="font-size:11px">${ago(s.now-m.t)} · ${esc(m.text)}</div>`).join("") || `<span class="dim">—</span>`;
}

document.getElementById("account").addEventListener("click", e => {
  const b = e.target.closest("button[data-cxl]");
  if (b) cancelMine(+b.dataset.cxl);
});
document.getElementById("ranking").addEventListener("click", e => {
  const b = e.target.closest("button[data-pin]");
  if (b) post("/api/pin", {symbol: b.dataset.pin, pinned: b.dataset.on === "1"});
});
document.getElementById("arm").addEventListener("click", async () => {
  const out = await post("/api/trade/arm", {on: !T().armed});
  if (!out.ok) toast("Can't arm: " + out.reason, false);
  else toast(out.armed ? "ARMED — clicks on the ladder now send orders" : "Disarmed", true);
});
document.getElementById("oneclick").addEventListener("change", e => post("/api/trade/oneclick", {on: e.target.checked}));
document.getElementById("bracket").addEventListener("change", e => post("/api/trade/bracket", {on: e.target.checked}));
document.getElementById("rotate").addEventListener("click", () => post("/api/autorotate", {on: !(state && state.auto_rotate)}));
document.getElementById("resetLayout").addEventListener("click", () => {
  store.clear();
  paneEls.forEach(p => { p.el.style.width = ""; p.el.style.height = ""; p.el.classList.remove("sized", "max"); p.body.style.removeProperty("--ladder-w");
    Object.assign(p.view, {cw: 7, offset: 0, yLo: null, yHi: null, follow: true}); renderTools(p); });
  document.body.classList.remove("has-max");
  paneEls.forEach(p => panesEl.appendChild(p.el));
});

let timer = null;
async function poll(now){
  clearTimeout(timer);
  try {
    const r = await fetch("/api/state", {cache:"no-store"});
    render(await r.json());
  } catch(e){
    const conn = document.getElementById("conn");
    conn.textContent = "DASHBOARD LOST CONTACT WITH TWINEY"; conn.className = "pill bad";
  }
  timer = setTimeout(poll, 500);
}
poll();
</script>
