{% extends "base.html" %}
{% block title %} — Sign in{% endblock %}
{% block body %}
<div style="max-width:380px;margin:60px auto 0;">
  <div class="card" style="padding:24px;">
    <h2 style="margin:0 0 4px;font-size:18px;">🛠️ PMWATCH</h2>
    <div class="muted" style="font-size:13px;margin-bottom:16px;">Sign in to continue</div>
    {% if error %}
    <div style="background:rgba(248,81,73,.12);border:1px solid var(--red);color:var(--red);
         border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login?next={{ next|urlencode }}">
      <label for="pw">Password</label>
      <input id="pw" type="password" name="password" autofocus autocomplete="current-password">
      <button type="submit" class="btn" style="width:100%;margin-top:14px;padding:11px;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
